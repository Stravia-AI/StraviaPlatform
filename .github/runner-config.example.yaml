# Example forgejo-runner config for a single Linux x64 host using the runner's
# built-in actions/cache proxy.
#
# Host setup (one-time):
#   forgejo-runner daemon -c .github/runner-config.example.yaml

log:
  level: info

runner:
  file: .runner
  capacity: 4
  timeout: 3h
  labels:
    - "ubuntu-latest:docker://ghcr.io/stravia-ai/stravia-ci-x64:latest"
    # Fallback using stock Ubuntu 24.04 (bootstrap_toolchain.sh installs missing tools).
    # - "ubuntu-latest:docker://ubuntu:24.04"
    # Optional KVM-enabled runner for Layer-2 Windows Desktop WebView2 E2E.
    # Runs `windows-kvm-desktop-e2e` inside stravia-ci:x64 (needs `--device /dev/kvm`
    # and read-only golden qcow2 + writable deps-cache mounts in container.options).
    - "linux-x64-kvm:docker://ghcr.io/stravia-ai/stravia-ci-x64:latest"

cache:
  enabled: true
  dir: "/var/cache/stravia-ci/actions-cache"

container:
  network: ""
  privileged: false
  options: "--device /dev/kvm -v /var/lib/stravia-win-vm:/opt/stravia-win-vm:ro -v /var/cache/stravia-win-vm:/var/cache/stravia-win-vm"
  force_pull: false
