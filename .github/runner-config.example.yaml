# Example forgejo-runner config for a single Linux x64 host using the runner's
# built-in actions/cache proxy.
#
# Host setup (one-time):
#   forgejo-runner daemon -c .github/runner-config.example.yaml

log:
  level: info

runner:
  file: .runner
  capacity: 4
  timeout: 3h
  labels:
    - "ubuntu-latest:docker://ghcr.io/stravia-ai/stravia-ci-x64:latest"
    # Fallback using stock Ubuntu 24.04 (bootstrap_toolchain.sh installs missing tools).
    # - "ubuntu-latest:docker://ubuntu:24.04"
    # Optional KVM-enabled runner for Layer-2 Windows Desktop WebView2 E2E.
    - "linux-x64-kvm:host"

cache:
  enabled: true
  dir: "/var/cache/stravia-ci/actions-cache"

container:
  network: ""
  privileged: false
  options: ""
  force_pull: false
