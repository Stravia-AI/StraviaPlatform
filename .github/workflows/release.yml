name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  BUN_VERSION: "1.4.0"
  TASK_VERSION: "3.52.0"
  ZIG_VERSION: "0.15.1"
  CARGO_ZIGBUILD_VERSION: "0.23.3"
  IMAGE_NAME: ghcr.io/stravia-ai/straviaplatform

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate release inputs
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main branch
        if: github.event_name == 'push'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, source commit, and repository versions
        id: release
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          cargo_version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          package_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          desktop_version = json.loads(Path("backend/apps/stravia-desktop/tauri.conf.json").read_text(encoding="utf-8"))["version"]

          publish = os.environ["GITHUB_EVENT_NAME"] == "push"
          tag = os.environ["GITHUB_REF_NAME"] if publish else f"v{cargo_version}"
          if publish and os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Release publication must be triggered by a tag push")
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")

          version = tag[1:]
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          match = re.fullmatch(
              rf"(?P<major>0|[1-9][0-9]*)\."
              rf"(?P<minor>0|[1-9][0-9]*)\."
              rf"(?P<patch>0|[1-9][0-9]*)"
              rf"(?:-(?P<prerelease>{identifier}(?:\.{identifier})*))?",
              version,
          )
          if match is None:
              raise SystemExit(
                  f"Release tag must be SemVer without build metadata, for example v1.2.3 or v1.2.3-rc.1: {tag}"
              )

          versions = {
              "Cargo.toml": cargo_version,
              "package.json": package_version,
              "tauri.conf.json": desktop_version,
          }
          mismatches = {path: value for path, value in versions.items() if value != version}
          if mismatches:
              details = ", ".join(f"{path}={value}" for path, value in mismatches.items())
              raise SystemExit(f"Tag {tag} does not match repository versions: {details}")

          if publish:
              tag_commit = subprocess.check_output(
                  ["git", "rev-parse", f"{tag}^{{commit}}"], text=True
              ).strip()
              ancestry = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", tag_commit, "origin/main"],
                  check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit(f"Tag {tag} does not point to a commit in origin/main")

          outputs = {
              "publish": str(publish).lower(),
              "tag": tag,
              "version": version,
              "major": match.group("major"),
              "minor": match.group("minor"),
              "prerelease": str(match.group("prerelease") is not None).lower(),
              "published_at": subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%cI",
                      f"{tag}^{{commit}}" if publish else "HEAD",
                  ],
                  text=True,
              ).strip(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  build-server:
    name: Server (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: linux-x86_64-gnu
            target: ""
            libc: gnu
            binary: target/release/stravia-server
          - runner: ubuntu-24.04
            suffix: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            libc: musl
            binary: target/x86_64-unknown-linux-musl/release/stravia-server
          - runner: ubuntu-24.04-arm
            suffix: linux-aarch64-gnu
            target: ""
            libc: gnu
            binary: target/release/stravia-server
          - runner: ubuntu-24.04-arm
            suffix: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            libc: musl
            binary: target/aarch64-unknown-linux-musl/release/stravia-server
          - runner: windows-latest
            suffix: windows-x86_64
            target: ""
            libc: windows
            binary: target/release/stravia-server.exe
          - runner: windows-11-arm
            suffix: windows-aarch64
            target: ""
            libc: windows
            binary: target/release/stravia-server.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Add musl target
        if: matrix.target != ''
        shell: bash
        run: rustup target add "${{ matrix.target }}" --toolchain "${RUST_VERSION}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup Zig
        if: matrix.libc == 'musl'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        if: matrix.libc == 'musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Configure BoringSSL for native Windows ARM64
        if: matrix.suffix == 'windows-aarch64'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:GITHUB_WORKSPACE '.github/cmake/windows-arm64.cmake'
          "CMAKE_TOOLCHAIN_FILE=$toolchain" >> $env:GITHUB_ENV

      - name: Build server with the native toolchain
        if: matrix.libc != 'musl'
        run: task build:server TARGET="${{ matrix.target }}"

      - name: Build static musl server with Zig
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          task build:web
          cargo zigbuild --locked --release -p stravia-server --target "${{ matrix.target }}"

      - name: Package Unix server
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET_BASENAME: stravia-server-v${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          BINARY_PATH: ${{ matrix.binary }}
        run: |
          mkdir -p "package/${ASSET_BASENAME}" dist
          install -m 0755 "${BINARY_PATH}" "package/${ASSET_BASENAME}/stravia-server"
          install -m 0644 LICENSE "package/${ASSET_BASENAME}/LICENSE"
          tar -C package -czf "dist/${ASSET_BASENAME}.tar.gz" "${ASSET_BASENAME}"

      - name: Package Windows server
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_BASENAME: stravia-server-v${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          BINARY_PATH: ${{ matrix.binary }}
        run: |
          $packageDirectory = Join-Path package $env:ASSET_BASENAME
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $env:BINARY_PATH (Join-Path $packageDirectory 'stravia-server.exe')
          Copy-Item LICENSE (Join-Path $packageDirectory 'LICENSE')
          Compress-Archive -Path $packageDirectory -DestinationPath "dist/$($env:ASSET_BASENAME).zip"

      - name: Upload server asset
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Desktop (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: linux-x86_64
            bundle: appimage
            bundle_directory: appimage
          - runner: ubuntu-24.04-arm
            suffix: linux-aarch64
            bundle: appimage
            bundle_directory: appimage
          - runner: windows-latest
            suffix: windows-x86_64
            bundle: nsis
            bundle_directory: nsis
          - runner: windows-11-arm
            suffix: windows-aarch64
            bundle: nsis
            bundle_directory: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xdg-utils \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Configure BoringSSL for native Windows ARM64
        if: matrix.suffix == 'windows-aarch64'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:GITHUB_WORKSPACE '.github/cmake/windows-arm64.cmake'
          "CMAKE_TOOLCHAIN_FILE=$toolchain" >> $env:GITHUB_ENV

      - name: Validate updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STRAVIA_UPDATER_PUBLIC_KEY: ${{ secrets.STRAVIA_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          test -n "${STRAVIA_UPDATER_PUBLIC_KEY}"
          python3 <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          raw_public_key = (
              os.environ["STRAVIA_UPDATER_PUBLIC_KEY"]
              .strip()
              .replace("\\r\\n", "\n")
              .replace("\\n", "\n")
          )
          payload_match = re.search(
              r"(?:^|\s)(RW[A-Za-z0-9+/=]+)\s*$",
              raw_public_key,
          )
          if payload_match is None:
              try:
                  decoded_public_key = base64.b64decode(
                      "".join(raw_public_key.split()),
                      validate=True,
                  ).decode("utf-8")
              except (ValueError, UnicodeDecodeError):
                  decoded_public_key = ""
              payload_match = re.search(
                  r"(?:^|\s)(RW[A-Za-z0-9+/=]+)\s*$",
                  decoded_public_key,
              )
          if payload_match is None:
              raise SystemExit(
                  "STRAVIA_UPDATER_PUBLIC_KEY must contain a Minisign public key"
              )
          public_key_text = (
              "untrusted comment: minisign public key\n"
              f"{payload_match.group(1)}\n"
          )
          public_key = base64.b64encode(
              public_key_text.encode("utf-8")
          ).decode("ascii")

          config_path = Path("backend/apps/stravia-desktop/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["plugins"]["updater"]["pubkey"] = public_key
          config_path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          delimiter = "STRAVIA_UPDATER_PUBLIC_KEY_EOF"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"STRAVIA_UPDATER_PUBLIC_KEY<<{delimiter}\n"
                  f"{public_key}\n"
                  f"{delimiter}\n"
              )
          PY

      - name: Build desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: task build:desktop BUNDLES="${{ matrix.bundle }}"

      - name: Collect Linux desktop bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET_NAME: stravia-desktop-v${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}.AppImage
        run: |
          shopt -s nullglob
          bundles=(target/release/bundle/${{ matrix.bundle_directory }}/*.AppImage)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            printf 'Expected exactly one AppImage, found %s\n' "${#bundles[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "${bundles[0]}" "dist/${ASSET_NAME}"
          cp "${bundles[0]}.sig" "dist/${ASSET_NAME}.sig"

      - name: Collect Windows desktop bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: stravia-desktop-v${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}-setup.exe
        run: |
          $bundles = @(Get-ChildItem 'target/release/bundle/${{ matrix.bundle_directory }}/*-setup.exe' -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($bundles.Count)"
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $bundles[0].FullName (Join-Path dist $env:ASSET_NAME)
          Copy-Item "$($bundles[0].FullName).sig" (Join-Path dist "$($env:ASSET_NAME).sig")

      - name: Upload desktop asset
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker validation (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache_scope: docker-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: docker-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/Stravia-AI/StraviaPlatform
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  nix-build:
    name: Nix (${{ matrix.system }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Configure Cachix for validation
        if: needs.prepare.outputs.publish != 'true'
        uses: cachix/cachix-action@v17
        with:
          name: stravia-platform
          skipPush: true

      - name: Validate Cachix credentials
        if: needs.prepare.outputs.publish == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "${CACHIX_AUTH_TOKEN}"

      - name: Configure Cachix for release
        if: needs.prepare.outputs.publish == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: stravia-platform
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Nix package
        run: nix build --print-build-logs .#server

  collect-assets:
    name: Collect release assets
    needs:
      - prepare
      - build-server
      - build-desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v7

      - name: Download server assets
        uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: release-assets
          merge-multiple: true

      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          python3 .github/scripts/generate_updater_manifest.py \
            --artifacts release-assets \
            --version "${{ needs.prepare.outputs.version }}" \
            --published-at "${{ needs.prepare.outputs.published_at }}" \
            --output release-assets/stravia-updater.json
          cd release-assets
          LC_ALL=C sha256sum -- * > SHA256SUMS

      - name: Upload consolidated release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  prepare-draft:
    name: Prepare draft release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - collect-assets
      - docker-build
      - nix-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Compose release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.escape(os.environ["VERSION"])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{version}\](?: - [^\n]+)?\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {os.environ['VERSION']}")

          notes = match.group("body").strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for {os.environ['VERSION']} is empty")

          Path(os.environ["RUNNER_TEMP"], "curated-release-notes.md").write_text(
              notes + "\n",
              encoding="utf-8",
          )
          PY

          gh api \
            --method POST \
            "repos/${GH_REPO}/releases/generate-notes" \
            -f "tag_name=${TAG_NAME}" \
            --jq '.body' \
            > "${RUNNER_TEMP}/generated-release-notes.md"

          {
            cat "${RUNNER_TEMP}/curated-release-notes.md"
            printf '\n---\n\n'
            cat "${RUNNER_TEMP}/generated-release-notes.md"
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG_NAME}" --draft --prerelease --latest=false --notes-file "${RELEASE_NOTES_FILE}"
            else
              gh release edit "${TAG_NAME}" --draft --prerelease=false --latest=false --notes-file "${RELEASE_NOTES_FILE}"
            fi
          else
            args=(
              "${TAG_NAME}"
              --verify-tag
              --draft
              --title "Stravia ${TAG_NAME}"
              --notes-file "${RELEASE_NOTES_FILE}"
              --latest=false
            )
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
          gh release upload "${TAG_NAME}" release-assets/* --clobber

  publish-image:
    name: Publish image digest (${{ matrix.platform }})
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - prepare-draft
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache_scope: docker-amd64
            artifact: docker-digest-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: docker-arm64
            artifact: docker-digest-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/Stravia-AI/StraviaPlatform
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push=true,push-by-digest=true,name-canonical=true

      - name: Export digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "${IMAGE_DIGEST}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish-image-manifest:
    name: Publish multi-architecture image
    needs:
      - prepare
      - publish-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major }}.${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}

      - name: Create and inspect multi-architecture manifest
        shell: bash
        env:
          TAGS_JSON: ${{ steps.metadata.outputs.json }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "${TAGS_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done

          shopt -s nullglob
          digest_files=("${RUNNER_TEMP}"/digests/*)
          if [[ ${#digest_files[@]} -ne 2 ]]; then
            printf 'Expected two image digests, found %s\n' "${#digest_files[@]}" >&2
            exit 1
          fi
          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - publish-image-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish completed draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            gh release edit "${TAG_NAME}" --draft=false --prerelease --latest=false
          else
            gh release edit "${TAG_NAME}" --draft=false --prerelease=false --latest
          fi
