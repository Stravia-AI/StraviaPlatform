name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.4.2"
  TASK_VERSION: "3.52.0"
  PATCH_CRATE_VERSION: "0.1.13"
  SCCACHE_VERSION: "0.10.0"
  CARGO_XWIN_VERSION: "0.22.0"
  APPLE_CODESIGN_VERSION: "0.29.0"
  XWIN_VERSION: "16"
  GITHUB_RELEASE_REPOSITORY: ${{ vars.GITHUB_RELEASE_REPOSITORY || 'Stravia-AI/StraviaPlatform' }}
  GITHUB_RELEASE_SERVER_URL: https://github.com
  GITHUB_RELEASE_API_URL: https://api.github.com
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME || 'ghcr.io/stravia-ai/straviaplatform' }}

jobs:
  prepare:
    name: Validate release inputs
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      published_at: ${{ steps.release.outputs.published_at }}
      include_macos: ${{ steps.release.outputs.include_macos }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require GitHub release and registry credentials
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_TOKEN || secrets.GITHUB_RELEASE_TOKEN }}
        run: |
          [[ -n "${GITHUB_RELEASE_TOKEN}" ]] || {
            echo 'Missing GITHUB_RELEASE_TOKEN secret for GitHub release publication' >&2
            exit 1
          }
          [[ -n "${REGISTRY_PASS}" ]] || {
            echo 'Missing CONTAINER_REGISTRY_TOKEN (or GITHUB_RELEASE_TOKEN) secret for container image publication' >&2
            exit 1
          }

      - name: Require bundled plugin catalog public key
        if: github.event_name == 'push'
        shell: bash
        run: |
          [[ -s backend/crates/stravia-core/assets/stravia-plugin-catalog.pub ]] || {
            echo 'Missing bundled plugin catalog public key' >&2
            exit 1
          }

      - name: Fetch main branch
        if: github.event_name == 'push'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, source commit, and repository versions
        id: release
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          cargo_version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          package_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          desktop_version = json.loads(Path("backend/apps/stravia-desktop/tauri.conf.json").read_text(encoding="utf-8"))["version"]

          publish = os.environ["GITHUB_EVENT_NAME"] == "push"
          tag = os.environ["GITHUB_REF_NAME"] if publish else f"v{cargo_version}"
          if publish and os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Release publication must be triggered by a tag push")
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")

          version = tag[1:]
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          match = re.fullmatch(
              rf"(?P<major>0|[1-9][0-9]*)\."
              rf"(?P<minor>0|[1-9][0-9]*)\."
              rf"(?P<patch>0|[1-9][0-9]*)"
              rf"(?:-(?P<prerelease>{identifier}(?:\.{identifier})*))?",
              version,
          )
          if match is None:
              raise SystemExit(
                  f"Release tag must be SemVer without build metadata, for example v1.2.3 or v1.2.3-rc.1: {tag}"
              )

          versions = {
              "Cargo.toml": cargo_version,
              "package.json": package_version,
              "tauri.conf.json": desktop_version,
          }
          mismatches = {path: value for path, value in versions.items() if value != version}
          if mismatches:
              details = ", ".join(f"{path}={value}" for path, value in mismatches.items())
              raise SystemExit(f"Tag {tag} does not match repository versions: {details}")

          if publish:
              tag_commit = subprocess.check_output(
                  ["git", "rev-parse", f"{tag}^{{commit}}"], text=True
              ).strip()
              ancestry = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", tag_commit, "origin/main"],
                  check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit(f"Tag {tag} does not point to a commit in origin/main")

          outputs = {
              "publish": str(publish).lower(),
              "tag": tag,
              "version": version,
              "major": match.group("major"),
              "minor": match.group("minor"),
              "prerelease": str(match.group("prerelease") is not None).lower(),
              "include_macos": "true",
              "published_at": subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%cI",
                      f"{tag}^{{commit}}" if publish else "HEAD",
                  ],
                  text=True,
              ).strip(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  build-shared-assets:
    name: Build shared WebUI & bundled base vendor once
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Linux x64 toolchain
        id: bootstrap
        env:
          RUST_TARGETS: "wasm32-wasip2"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Restore Linux x64 sccache (rolling)
        id: sccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-shared
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-x64-

      - name: Restore compiled Wasm vendor plugins
        id: vendor-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/vendor-plugins
            .task/checksum/build-vendors
          key: vendor-fixtures-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'patches/*+*.patch', '.cargo/config.toml', 'backend/crates/stravia-vendor-*/**', 'backend/crates/stravia-protocol-codec/**', 'backend/crates/stravia-runtime-contract/**', 'backend/crates/stravia-core/assets/providers.stravia.json', 'frontend/stravia-webui/src/assets/icons/*.svg', 'tests/common/build-plugin-marketplace-fixtures.ts') }}

      - name: Build WebUI dist and bundled base Wasm vendor once
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          bash .github/scripts/prepare_cargo_deps.sh
          task install:web
          task build:web
          task build:vendors

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux x64 sccache (rolling)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-shared

      - name: Upload shared release build inputs
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: release-shared-assets
          path: |
            frontend/stravia-webui/dist
            target/vendor-plugins
          if-no-files-found: error
          retention-days: 1

  build-vendor-plugins:
    name: Standalone vendor plugins (wasm32-wasip2)
    needs:
      - prepare
      - build-shared-assets
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      has_plugins: ${{ steps.select.outputs.has_plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select changed plugins
        id: select
        env:
          FORGEJO_API_URL: ""
          FORGEJO_REPOSITORY: ""
          FORGEJO_TOKEN: ""
          GITHUB_API_URL: ${{ env.GITHUB_RELEASE_API_URL }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_RELEASE_REPOSITORY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: python3 .github/scripts/select_vendor_plugins.py

      - name: Upload selection marker
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: vendor-plugin-selection
          path: stravia-plugin-selection-v1.json
          if-no-files-found: error
          retention-days: 7

      - name: Download shared bundled base vendor
        if: steps.select.outputs.has_plugins == 'true'
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: release-shared-assets
          path: .

      - name: Bootstrap Linux x64 toolchain
        id: bootstrap
        if: steps.select.outputs.has_plugins == 'true'
        env:
          NEED_MINISIGN: "1"
          RUST_TARGETS: "wasm32-wasip2"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        if: steps.select.outputs.has_plugins == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Restore Linux x64 sccache (rolling)
        id: sccache-cache
        if: steps.select.outputs.has_plugins == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-plugins
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-x64-

      - name: Prepare patched crates
        if: steps.select.outputs.has_plugins == 'true'
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: bash .github/scripts/prepare_cargo_deps.sh

      - name: Build standalone plugins
        if: steps.select.outputs.has_plugins == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
        run: cargo run --locked -p stravia-vendor-base --bin stravia-build-vendors -- "--only=${SELECTED}"

      - name: Prepare plugin declarations
        if: steps.select.outputs.has_plugins == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("target/vendor-plugins-all")
          records = json.loads((directory / "manifest.json").read_text())
          names = {
              "openai-codex": "OpenAI Codex",
              "xai-grok": "xAI Grok",
              "command-code": "Command Code",
              "devin": "Devin",
              "opencode-free": "OpenCode Zen Free",
              "claude-code": "Claude Code",
              "antigravity": "Antigravity",
              "kiro": "Kiro",
          }
          dedicated = [record for record in records if record["vendor_id"] != "base"]
          selected = set(os.environ["SELECTED"].split(","))
          if not selected <= set(names) or len(dedicated) != len(selected) or {record["vendor_id"] for record in dedicated} != selected:
              raise SystemExit("Selected plugin release inventory is incomplete")
          declarations = []
          for record in dedicated:
              if record["version"] != os.environ["RELEASE_VERSION"]:
                  raise SystemExit("Plugin version does not match the release")
              source = directory / record["file"]
              if hashlib.sha256(source.read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit(f"Plugin digest mismatch: {record['vendor_id']}")
              declarations.append({
                  "file": str(source),
                  "vendor_id": record["vendor_id"],
                  "version": record["version"],
                  "display_name": names[record["vendor_id"]],
              })
          Path("plugin-input.json").write_text(json.dumps(declarations))
          PY

      - name: Verify prebuilt bundled base vendor exists
        if: steps.select.outputs.has_plugins == 'true'
        run: test -s target/vendor-plugins/manifest.json

      - name: Generate catalog and compressed assets
        if: steps.select.outputs.has_plugins == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          REPOSITORY_ID: ${{ vars.OFFICIAL_REPOSITORY_ID || '1350654373' }}
        run: |
          cargo run --release -p stravia-devtools --bin stravia-tools -- plugin-catalog \
            --repository-id "${REPOSITORY_ID}" --release-tag "${RELEASE_TAG}" \
            --host-version-req ">=${RELEASE_VERSION}" --published-at "${PUBLISHED_AT}" \
            --input plugin-input.json --output dist

      - name: Sign and verify catalog against pinned identity
        if: steps.select.outputs.has_plugins == 'true'
        env:
          SIGNING_KEY: ${{ secrets.STRAVIA_PLUGIN_CATALOG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.STRAVIA_PLUGIN_CATALOG_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" && -n "${SIGNING_PASSWORD}" ]] || { echo 'Missing plugin catalog signing configuration' >&2; exit 1; }
          key_file=$(mktemp)
          trap 'rm -f "${key_file}"' EXIT
          chmod 600 "${key_file}"
          printf '%s\n' "${SIGNING_KEY}" > "${key_file}"
          cp backend/crates/stravia-core/assets/stravia-plugin-catalog.pub dist/stravia-plugin-catalog.pub
          printf '%s\n' "${SIGNING_PASSWORD}" | minisign -S -s "${key_file}" -m dist/stravia-plugin-catalog.json -x dist/stravia-plugin-catalog.json.minisig
          minisign -V -p dist/stravia-plugin-catalog.pub -m dist/stravia-plugin-catalog.json -x dist/stravia-plugin-catalog.json.minisig

      - name: Upload dedicated plugin assets
        if: steps.select.outputs.has_plugins == 'true'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: vendor-plugins
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Show sccache stats
        id: sccache-stats
        if: always() && steps.select.outputs.has_plugins == 'true'
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux x64 sccache (rolling)
        if: always() && steps.select.outputs.has_plugins == 'true' && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-plugins

  # Combined Linux x64 build: compiles stravia-server (x64), stravia-desktop AppImage (x64),
  # and stravia-server (arm64 cross) in one container to reuse stravia-core, sccache, and WebUI dist.
  build-linux-x64:
    name: Linux builds (x64 server + x64 desktop + arm64 server)
    needs:
      - prepare
      - build-shared-assets
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download shared WebUI dist & bundled vendors
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: release-shared-assets
          path: .

      - name: Bootstrap Linux x64 desktop + arm64 cross toolchain
        id: bootstrap
        env:
          NEED_LINUX_DESKTOP: "1"
          NEED_LINUX_ARM64: "1"
          RUST_TARGETS: "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Restore Linux x64 sccache (rolling)
        id: sccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-release
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-x64-

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_updater_signing.py

      - name: Prepare patched crates
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: bash .github/scripts/prepare_cargo_deps.sh

      - name: Build & package Linux x86_64 server
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked -p stravia-server --release --target x86_64-unknown-linux-gnu
          asset="stravia-server-v${VERSION}-linux-x86_64-gnu"
          mkdir -p "package/${asset}" dist-server-x64
          install -m 0755 target/x86_64-unknown-linux-gnu/release/stravia-server "package/${asset}/stravia-server"
          install -m 0644 LICENSE "package/${asset}/LICENSE"
          tar -C package -czf "dist-server-x64/${asset}.tar.gz" "${asset}"

      - name: Build & package Linux x86_64 desktop AppImage (reuses target/ & WebUI dist)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          (
            cd backend/apps/stravia-desktop
            bunx --bun @tauri-apps/cli@2.12.6 build \
              --target x86_64-unknown-linux-gnu \
              --config tauri.release.conf.json \
              --config '{"build":{"beforeBuildCommand":""}}' \
              --bundles appimage -- --locked
          )
          mkdir -p dist-desktop-x64
          bundles=(target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Expected 1 x86_64 AppImage, found ${#bundles[@]}" >&2
            exit 1
          fi
          asset="stravia-desktop-v${VERSION}-linux-x86_64.AppImage"
          cp "${bundles[0]}" "dist-desktop-x64/${asset}"
          cp "${bundles[0]}.sig" "dist-desktop-x64/${asset}.sig"

      - name: Build & package Linux aarch64 server (cross)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          set -euo pipefail
          cargo build --locked -p stravia-server --release --target aarch64-unknown-linux-gnu
          asset="stravia-server-v${VERSION}-linux-aarch64-gnu"
          mkdir -p "package/${asset}" dist-server-arm64
          install -m 0755 target/aarch64-unknown-linux-gnu/release/stravia-server "package/${asset}/stravia-server"
          install -m 0644 LICENSE "package/${asset}/LICENSE"
          tar -C package -czf "dist-server-arm64/${asset}.tar.gz" "${asset}"

      - name: Upload Linux x86_64 server asset
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: server-linux-x86_64-gnu
          path: dist-server-x64/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux x86_64 desktop asset
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: dist-desktop-x64/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux aarch64 server asset
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: server-linux-aarch64-gnu
          path: dist-server-arm64/*
          if-no-files-found: error
          retention-days: 7

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux x64 sccache (rolling, even on build failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-release

  # Combined Windows MSVC cross-build per arch: compiles server + desktop NSIS in one container
  # sharing cargo-xwin SDK, target/<triple>/release/, sccache, and prebuilt WebUI dist.
  build-windows:
    name: Windows builds (${{ matrix.suffix }} server + desktop)
    needs:
      - prepare
      - build-shared-assets
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: windows-x86_64
            target: x86_64-pc-windows-msvc
          - suffix: windows-aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download shared WebUI dist & bundled vendors
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: release-shared-assets
          path: .

      - name: Bootstrap Linux x64 Windows cross-compile toolchain
        id: bootstrap
        env:
          NEED_XWIN: "1"
          RUST_TARGETS: "${{ matrix.target }}"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Restore Windows sccache (rolling)
        id: sccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-${{ matrix.suffix }}-

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_updater_signing.py

      - name: Prepare patched crates
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: bash .github/scripts/prepare_cargo_deps.sh

      - name: Build & package Windows server + desktop NSIS (shared target/)
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ "${TARGET_TRIPLE}" == "aarch64-pc-windows-msvc" ]]; then
            shim_dir="$(mktemp -d)"
            trap 'rm -rf "${shim_dir}"' EXIT
            export STRAVIA_REAL_CLANG="$(command -v clang)"
            cp .github/scripts/xwin_clang_wrapper.sh "${shim_dir}/clang"
            chmod +x "${shim_dir}/clang"
            export PATH="${shim_dir}:${PATH}"
          fi

          cargo xwin build --locked -p stravia-server --release --target "${TARGET_TRIPLE}"
          server_asset="stravia-server-v${VERSION}-${SUFFIX}"
          mkdir -p "package/${server_asset}" dist-server
          cp "target/${TARGET_TRIPLE}/release/stravia-server.exe" "package/${server_asset}/stravia-server.exe"
          cp LICENSE "package/${server_asset}/LICENSE"
          (cd package && zip -r "../dist-server/${server_asset}.zip" "${server_asset}")

          (
            cd backend/apps/stravia-desktop
            bunx --bun @tauri-apps/cli@2.12.6 build \
              --runner cargo-xwin \
              --target "${TARGET_TRIPLE}" \
              --config tauri.release.conf.json \
              --config '{"build":{"beforeBuildCommand":""}}' \
              --bundles nsis -- --locked
          )
          mkdir -p dist-desktop
          bundles=(target/"${TARGET_TRIPLE}"/release/bundle/nsis/*-setup.exe)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Expected 1 NSIS bundle for ${TARGET_TRIPLE}, found ${#bundles[@]}" >&2
            exit 1
          fi
          desktop_asset="stravia-desktop-v${VERSION}-${SUFFIX}-setup.exe"
          cp "${bundles[0]}" "dist-desktop/${desktop_asset}"
          cp "${bundles[0]}.sig" "dist-desktop/${desktop_asset}.sig"

      - name: Upload Windows server asset
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: server-${{ matrix.suffix }}
          path: dist-server/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows desktop asset
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: desktop-${{ matrix.suffix }}
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 7

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Windows sccache (rolling, even on build failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}

  # Cross-compile Linux aarch64 desktop binary natively on x86_64 (fast rustc + arm64 multiarch sysroot),
  # then bundle AppImage using host aarch64 binfmt (only linuxdeploy/appimagetool run under QEMU).
  build-linux-arm64-desktop:
    name: Desktop cross-build (linux-aarch64)
    needs:
      - prepare
      - build-shared-assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download shared WebUI dist & bundled vendors
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: release-shared-assets
          path: .

      - name: Cache Rust build toolchain binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.bun/bin
            ~/.local/bin
          key: toolchain-rust-${{ env.RUST_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-bun${{ env.BUN_VERSION }}-task${{ env.TASK_VERSION }}-wasip2-v1
          restore-keys: |
            toolchain-rust-${{ env.RUST_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-bun${{ env.BUN_VERSION }}-task${{ env.TASK_VERSION }}-

      - name: Bootstrap Linux arm64 desktop cross-compile toolchain
        id: bootstrap
        env:
          NEED_LINUX_ARM64: "1"
          NEED_LINUX_ARM64_DESKTOP: "1"
          RUST_TARGETS: "aarch64-unknown-linux-gnu"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Restore Linux arm64 sccache (rolling)
        id: sccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-arm64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-arm64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-arm64-

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_updater_signing.py

      - name: Prepare patched crates
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: bash .github/scripts/prepare_cargo_deps.sh

      - name: Cross-compile & package Linux aarch64 desktop AppImage
        env:
          ARCH: aarch64
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          OPENSSL_DIR: /usr
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ "$(uname -m)" == "x86_64" ]] && ! ls /proc/sys/fs/binfmt_misc/*aarch64* >/dev/null 2>&1; then
            echo "ERROR: aarch64 binfmt_misc handler is required on x86_64 to run linuxdeploy-aarch64 (enable boot.binfmt.emulatedSystems = [ \"aarch64-linux\" ] on host)" >&2
            exit 1
          fi
          (
            cd backend/apps/stravia-desktop
            bunx --bun @tauri-apps/cli@2.12.6 build \
              --target aarch64-unknown-linux-gnu \
              --config tauri.release.conf.json \
              --config '{"build":{"beforeBuildCommand":""}}' \
              --bundles appimage -- --locked
          )
          mkdir -p dist
          bundles=(target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Expected 1 aarch64 AppImage, found ${#bundles[@]}" >&2
            exit 1
          fi
          asset="stravia-desktop-v${VERSION}-linux-aarch64.AppImage"
          cp "${bundles[0]}" "dist/${asset}"
          cp "${bundles[0]}.sig" "dist/${asset}.sig"

      - name: Upload Linux aarch64 desktop asset
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: desktop-linux-aarch64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-arm64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux arm64 sccache (rolling, even on build failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-arm64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}

  build-macos-cross:
    name: Desktop cross-build (${{ matrix.suffix }}, osxcross)
    needs:
      - prepare
      - build-shared-assets
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: darwin-aarch64
            target: aarch64-apple-darwin
            arch: arm64
            cmake_file: .github/cmake/macos-aarch64.cmake
          - suffix: darwin-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
            cmake_file: .github/cmake/macos-x86_64.cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download shared WebUI dist & bundled vendors
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: release-shared-assets
          path: .

      - name: Restore osxcross toolchain cache (when not prebuilt in image)
        uses: actions/cache@v6
        with:
          path: /opt/osxcross/target
          key: osxcross-899260ca-sdk15.5-linux-x64-v1
          restore-keys: |
            osxcross-899260ca-sdk15.5-linux-x64-v1

      - name: Bootstrap Linux x64 macOS cross-compile toolchain (osxcross + MacOSX15.5 SDK)
        id: bootstrap
        env:
          NEED_BUN: "0"
          NEED_MACOS_CROSS: "1"
          RUST_TARGETS: "${{ matrix.target }}"
          MACOS_SDK_URL: ${{ vars.MACOS_SDK_URL || 'https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz' }}
          MACOS_SDK_SHA256: ${{ vars.MACOS_SDK_SHA256 || 'c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd' }}
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Restore macOS sccache (rolling)
        id: sccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-macos-${{ matrix.suffix }}-

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_updater_signing.py

      - name: Prepare patched crates
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: bash .github/scripts/prepare_cargo_deps.sh

      - name: Cross-compile macOS desktop binary via osxcross
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/${{ matrix.cmake_file }}
        run: cargo build --locked -p stravia-desktop --release --target ${{ matrix.target }}

      - name: Package .app, rcodesign (Hardened Runtime + entitlements), updater archive, and .dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python3 .github/scripts/package_macos_cross.py \
            --binary "target/${{ matrix.target }}/release/stravia-desktop" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output-dir dist

      - name: Upload macOS release assets
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: desktop-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save macOS sccache (rolling, even on build failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}

  docker-build:
    name: Docker cross-validation (${{ matrix.platform }})
    if: needs.prepare.outputs.publish != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image via BuildKit cross-compilation without publishing
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx build \
            --platform "${PLATFORM}" \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_RELEASE_SERVER_URL}/${GITHUB_RELEASE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            .

  collect-assets:
    name: Collect release assets
    needs:
      - prepare
      - build-linux-x64
      - build-linux-arm64-desktop
      - build-windows
      - build-macos-cross
      - build-vendor-plugins
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build-linux-x64.result == 'success' && needs.build-linux-arm64-desktop.result == 'success' && needs.build-windows.result == 'success' && needs.build-vendor-plugins.result == 'success' && (needs.build-macos-cross.result == 'success' || needs.build-macos-cross.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v7

      - name: Download server linux-x86_64-gnu
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: server-linux-x86_64-gnu
          path: release-assets

      - name: Download server linux-aarch64-gnu
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: server-linux-aarch64-gnu
          path: release-assets

      - name: Download server windows-x86_64
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: server-windows-x86_64
          path: release-assets

      - name: Download server windows-aarch64
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: server-windows-aarch64
          path: release-assets

      - name: Download desktop linux-x86_64
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: release-assets

      - name: Download desktop linux-aarch64
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: desktop-linux-aarch64
          path: release-assets

      - name: Download desktop windows-x86_64
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: release-assets

      - name: Download desktop windows-aarch64
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: desktop-windows-aarch64
          path: release-assets

      - name: Download desktop darwin-aarch64
        if: needs.prepare.outputs.include_macos == 'true'
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: desktop-darwin-aarch64
          path: release-assets

      - name: Download desktop darwin-x86_64
        if: needs.prepare.outputs.include_macos == 'true'
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: desktop-darwin-x86_64
          path: release-assets

      - name: Download selection marker
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: vendor-plugin-selection
          path: release-assets

      - name: Download dedicated plugin assets
        if: needs.build-vendor-plugins.outputs.has_plugins == 'true'
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: vendor-plugins
          path: release-assets

      - name: Generate updater manifest and SHA256SUMS
        shell: bash
        env:
          INCLUDE_MACOS: ${{ needs.prepare.outputs.include_macos }}
        run: |
          set -euo pipefail
          platforms="linux-x86_64,linux-aarch64,windows-x86_64,windows-aarch64"
          if [[ "${INCLUDE_MACOS}" == "true" ]]; then
            platforms="${platforms},darwin-aarch64,darwin-x86_64"
          fi
          python3 .github/scripts/generate_updater_manifest.py \
            --artifacts release-assets \
            --version "${{ needs.prepare.outputs.version }}" \
            --published-at "${{ needs.prepare.outputs.published_at }}" \
            --repository-url "${GITHUB_RELEASE_SERVER_URL}/${GITHUB_RELEASE_REPOSITORY}" \
            --platforms "${platforms}" \
            --output release-assets/stravia-updater.json
          cd release-assets
          LC_ALL=C sha256sum -- * > SHA256SUMS

      - name: Upload consolidated release assets
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  wait-ci:
    name: Wait for CI on this commit
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout CI gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/wait_for_ci.py
          sparse-checkout-cone-mode: false

      - name: Wait for CI workflow to succeed on commit SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/wait_for_ci.py \
            --api-url "${GITHUB_API_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --workflow-file "ci.yml"

  prepare-draft:
    name: Prepare draft release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - wait-ci
      - collect-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Sync release tag to GitHub mirror
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_RELEASE_REPOSITORY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "${GITHUB_TOKEN}" ]] || { echo 'Missing GITHUB_RELEASE_TOKEN secret' >&2; exit 1; }
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.extraheader=${auth_header}" push \
            "${GITHUB_RELEASE_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

      - name: Compose release notes & sync draft release
        shell: bash
        env:
          GITHUB_API_URL: ${{ env.GITHUB_RELEASE_API_URL }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_RELEASE_REPOSITORY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_api.py compose-notes \
            --changelog CHANGELOG.md \
            --version "${VERSION}" \
            --tag "${TAG_NAME}" \
            --output "${RUNNER_TEMP}/release-notes.md"
          python3 .github/scripts/release_api.py upsert-draft \
            --platform github \
            --tag "${TAG_NAME}" \
            --title "Stravia ${TAG_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease "${IS_PRERELEASE}" \
            --assets-dir release-assets

  publish-image:
    name: Publish multi-arch container image
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - prepare-draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        shell: bash
        env:
          REGISTRY_USER: ${{ vars.CONTAINER_REGISTRY_USER || github.actor }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_TOKEN || secrets.GITHUB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${REGISTRY_PASS}" ]] || { echo 'Missing CONTAINER_REGISTRY_TOKEN (or GITHUB_RELEASE_TOKEN) secret' >&2; exit 1; }
          printf '%s\n' "${REGISTRY_PASS}" | docker login "${CONTAINER_REGISTRY}" -u "${REGISTRY_USER}" --password-stdin

      - name: Build and push multi-architecture image from Linux x64
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          MINOR: ${{ needs.prepare.outputs.minor }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          image_name="${IMAGE_NAME,,}"
          tags=(--tag "${image_name}:${VERSION}")
          if [[ "${PRERELEASE}" == "false" ]]; then
            tags+=(
              --tag "${image_name}:${MAJOR}.${MINOR}"
              --tag "${image_name}:${MAJOR}"
              --tag "${image_name}:latest"
            )
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_RELEASE_SERVER_URL}/${GITHUB_RELEASE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            "${tags[@]}" \
            .

  publish-release:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release helper
        uses: actions/checkout@v7

      - name: Publish completed draft
        env:
          GITHUB_API_URL: ${{ env.GITHUB_RELEASE_API_URL }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_RELEASE_REPOSITORY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          python3 .github/scripts/release_api.py publish \
            --platform github \
            --tag "${TAG_NAME}" \
            --prerelease "${IS_PRERELEASE}"
