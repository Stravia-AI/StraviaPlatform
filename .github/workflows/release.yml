name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Skip CI verification before dry-run build (workflow_dispatch only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.4.2"
  TASK_VERSION: "3.52.0"
  PATCH_CRATE_VERSION: "0.1.13"
  SCCACHE_VERSION: "0.10.0"
  CARGO_XWIN_VERSION: "0.22.0"
  APPLE_CODESIGN_VERSION: "0.29.0"
  XWIN_VERSION: "16"
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || (github.server_url == 'https://github.com' && 'ghcr.io' || 'codeberg.org') }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME || format('{0}/{1}', vars.CONTAINER_REGISTRY || (github.server_url == 'https://github.com' && 'ghcr.io' || 'codeberg.org'), github.repository) }}

jobs:
  checks:
    name: Release checks
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_checks
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate release inputs
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_checks)) }}
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      published_at: ${{ steps.release.outputs.published_at }}
      include_macos: ${{ steps.release.outputs.include_macos }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require bundled plugin catalog public key
        if: github.event_name == 'push'
        shell: bash
        run: |
          [[ -s backend/crates/stravia-core/assets/stravia-plugin-catalog.pub ]] || {
            echo 'Missing bundled plugin catalog public key' >&2
            exit 1
          }

      - name: Fetch main branch
        if: github.event_name == 'push'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, source commit, and repository versions
        id: release
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          cargo_version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          package_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          desktop_version = json.loads(Path("backend/apps/stravia-desktop/tauri.conf.json").read_text(encoding="utf-8"))["version"]

          publish = os.environ["GITHUB_EVENT_NAME"] == "push"
          tag = os.environ["GITHUB_REF_NAME"] if publish else f"v{cargo_version}"
          if publish and os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Release publication must be triggered by a tag push")
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")

          version = tag[1:]
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          match = re.fullmatch(
              rf"(?P<major>0|[1-9][0-9]*)\."
              rf"(?P<minor>0|[1-9][0-9]*)\."
              rf"(?P<patch>0|[1-9][0-9]*)"
              rf"(?:-(?P<prerelease>{identifier}(?:\.{identifier})*))?",
              version,
          )
          if match is None:
              raise SystemExit(
                  f"Release tag must be SemVer without build metadata, for example v1.2.3 or v1.2.3-rc.1: {tag}"
              )

          versions = {
              "Cargo.toml": cargo_version,
              "package.json": package_version,
              "tauri.conf.json": desktop_version,
          }
          mismatches = {path: value for path, value in versions.items() if value != version}
          if mismatches:
              details = ", ".join(f"{path}={value}" for path, value in mismatches.items())
              raise SystemExit(f"Tag {tag} does not match repository versions: {details}")

          if publish:
              tag_commit = subprocess.check_output(
                  ["git", "rev-parse", f"{tag}^{{commit}}"], text=True
              ).strip()
              ancestry = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", tag_commit, "origin/main"],
                  check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit(f"Tag {tag} does not point to a commit in origin/main")

          outputs = {
              "publish": str(publish).lower(),
              "tag": tag,
              "version": version,
              "major": match.group("major"),
              "minor": match.group("minor"),
              "prerelease": str(match.group("prerelease") is not None).lower(),
              "include_macos": "true",
              "published_at": subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%cI",
                      f"{tag}^{{commit}}" if publish else "HEAD",
                  ],
                  text=True,
              ).strip(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  build-vendor-plugins:
    name: Standalone vendor plugins (wasm32-wasip2)
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      has_plugins: ${{ steps.select.outputs.has_plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select changed plugins
        id: select
        env:
          FORGEJO_API_URL: ${{ github.api_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: python3 .github/scripts/select_vendor_plugins.py

      - name: Upload selection marker
        uses: actions/upload-artifact@v7
        with:
          name: vendor-plugin-selection
          path: stravia-plugin-selection-v1.json
          if-no-files-found: error
          retention-days: 7

      - name: Detect persistent host cache volume
        id: host-cache
        if: steps.select.outputs.has_plugins == 'true'
        shell: bash
        run: |
          if [[ -d "${CI_CACHE_DIR:-/ci-cache}" && -w "${CI_CACHE_DIR:-/ci-cache}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust toolchain binaries (rustup, patch-crate, sccache, bun, task)
        if: steps.select.outputs.has_plugins == 'true' && steps.host-cache.outputs.enabled != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.bun/bin
            ~/.local/bin
          key: toolchain-rust-${{ env.RUST_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-bun${{ env.BUN_VERSION }}-task${{ env.TASK_VERSION }}-wasip2-v1-release-plugins
          restore-keys: |
            toolchain-rust-${{ env.RUST_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-bun${{ env.BUN_VERSION }}-task${{ env.TASK_VERSION }}-wasip2-v1-

      - name: Bootstrap Linux x64 toolchain
        id: bootstrap
        if: steps.select.outputs.has_plugins == 'true'
        env:
          NEED_MINISIGN: "1"
          RUST_TARGETS: "wasm32-wasip2"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo and sccache
        if: steps.select.outputs.has_plugins == 'true' && steps.bootstrap.outputs.host_cache != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sccache
          key: release-plugins-v1-${{ hashFiles('Cargo.lock', 'patches/*+*.patch', '.cargo/config.toml') }}
          restore-keys: |
            release-plugins-v1-

      - name: Prepare patched crates
        if: steps.select.outputs.has_plugins == 'true'
        run: task prepare:crates

      - name: Build standalone plugins
        if: steps.select.outputs.has_plugins == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
        run: cargo run --locked -p stravia-vendor-base --bin stravia-build-vendors -- "--only=${SELECTED}"

      - name: Prepare plugin declarations
        if: steps.select.outputs.has_plugins == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("target/vendor-plugins-all")
          records = json.loads((directory / "manifest.json").read_text())
          names = {
              "openai-codex": "OpenAI Codex",
              "xai-grok": "xAI Grok",
              "command-code": "Command Code",
              "devin": "Devin",
              "opencode-free": "OpenCode Zen Free",
              "claude-code": "Claude Code",
              "antigravity": "Antigravity",
              "kiro": "Kiro",
          }
          dedicated = [record for record in records if record["vendor_id"] != "base"]
          selected = set(os.environ["SELECTED"].split(","))
          if not selected <= set(names) or len(dedicated) != len(selected) or {record["vendor_id"] for record in dedicated} != selected:
              raise SystemExit("Selected plugin release inventory is incomplete")
          declarations = []
          for record in dedicated:
              if record["version"] != os.environ["RELEASE_VERSION"]:
                  raise SystemExit("Plugin version does not match the release")
              source = directory / record["file"]
              if hashlib.sha256(source.read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit(f"Plugin digest mismatch: {record['vendor_id']}")
              declarations.append({
                  "file": str(source),
                  "vendor_id": record["vendor_id"],
                  "version": record["version"],
                  "display_name": names[record["vendor_id"]],
              })
          Path("plugin-input.json").write_text(json.dumps(declarations))
          PY

      - name: Prepare builtin components for catalog tool
        if: steps.select.outputs.has_plugins == 'true'
        run: task build:vendors

      - name: Generate catalog and compressed assets
        if: steps.select.outputs.has_plugins == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          REPOSITORY_ID: ${{ vars.OFFICIAL_REPOSITORY_ID || '1350654373' }}
        run: |
          cargo run --release -p stravia-devtools --bin stravia-tools -- plugin-catalog \
            --repository-id "${REPOSITORY_ID}" --release-tag "${RELEASE_TAG}" \
            --host-version-req ">=${RELEASE_VERSION}" --published-at "${PUBLISHED_AT}" \
            --input plugin-input.json --output dist

      - name: Sign and verify catalog against pinned identity
        if: steps.select.outputs.has_plugins == 'true'
        env:
          SIGNING_KEY: ${{ secrets.STRAVIA_PLUGIN_CATALOG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.STRAVIA_PLUGIN_CATALOG_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" && -n "${SIGNING_PASSWORD}" ]] || { echo 'Missing plugin catalog signing configuration' >&2; exit 1; }
          key_file=$(mktemp)
          trap 'rm -f "${key_file}"' EXIT
          chmod 600 "${key_file}"
          printf '%s\n' "${SIGNING_KEY}" > "${key_file}"
          cp backend/crates/stravia-core/assets/stravia-plugin-catalog.pub dist/stravia-plugin-catalog.pub
          printf '%s\n' "${SIGNING_PASSWORD}" | minisign -S -s "${key_file}" -m dist/stravia-plugin-catalog.json -x dist/stravia-plugin-catalog.json.minisig
          minisign -V -p dist/stravia-plugin-catalog.pub -m dist/stravia-plugin-catalog.json -x dist/stravia-plugin-catalog.json.minisig

      - name: Upload dedicated plugin assets
        if: steps.select.outputs.has_plugins == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vendor-plugins
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-server:
    name: Server cross-build (${{ matrix.suffix }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x86_64-gnu
            target: x86_64-unknown-linux-gnu
            kind: linux-native
            binary: target/x86_64-unknown-linux-gnu/release/stravia-server
            archive: tar.gz
          - suffix: linux-aarch64-gnu
            target: aarch64-unknown-linux-gnu
            kind: linux-arm64
            binary: target/aarch64-unknown-linux-gnu/release/stravia-server
            archive: tar.gz
          - suffix: windows-x86_64
            target: x86_64-pc-windows-msvc
            kind: windows-xwin
            binary: target/x86_64-pc-windows-msvc/release/stravia-server.exe
            archive: zip
          - suffix: windows-aarch64
            target: aarch64-pc-windows-msvc
            kind: windows-xwin
            binary: target/aarch64-pc-windows-msvc/release/stravia-server.exe
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect persistent host cache volume
        id: host-cache
        shell: bash
        run: |
          if [[ -d "${CI_CACHE_DIR:-/ci-cache}" && -w "${CI_CACHE_DIR:-/ci-cache}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust cross-compile toolchain binaries
        if: steps.host-cache.outputs.enabled != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.bun/bin
            ~/.local/bin
          key: toolchain-release-server-${{ matrix.suffix }}-${{ env.RUST_VERSION }}-xwin${{ env.CARGO_XWIN_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-v1
          restore-keys: |
            toolchain-release-server-${{ matrix.suffix }}-${{ env.RUST_VERSION }}-
            toolchain-rust-${{ env.RUST_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-bun${{ env.BUN_VERSION }}-task${{ env.TASK_VERSION }}-wasip2-v1-

      - name: Bootstrap Linux x64 cross-compile toolchain
        id: bootstrap
        env:
          NEED_XWIN: ${{ startsWith(matrix.kind, 'windows-') && '1' || '0' }}
          NEED_LINUX_ARM64: ${{ matrix.kind == 'linux-arm64' && '1' || '0' }}
          RUST_TARGETS: "wasm32-wasip2 ${{ matrix.target }}"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo, sccache, Bun, and xwin SDK
        if: steps.bootstrap.outputs.host_cache != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sccache
            ~/.cache/cargo-xwin
            ~/.bun/install/cache
          key: release-server-${{ matrix.suffix }}-v1-${{ hashFiles('Cargo.lock', 'bun.lock', 'patches/*+*.patch', '.cargo/config.toml') }}
          restore-keys: |
            release-server-${{ matrix.suffix }}-v1-

      - name: Prepare patched crates, WebUI, and bundled vendors
        run: |
          task prepare:crates
          task build:web
          task build:vendors

      - name: Build server (Linux native)
        if: matrix.kind == 'linux-native'
        run: cargo build --locked -p stravia-server --release --target ${{ matrix.target }}

      - name: Build server (Linux aarch64 cross)
        if: matrix.kind == 'linux-arm64'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --locked -p stravia-server --release --target ${{ matrix.target }}

      - name: Build server (Windows MSVC via cargo-xwin)
        if: matrix.kind == 'windows-xwin'
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-pc-windows-msvc" ]]; then
            shim_dir="$(mktemp -d)"
            trap 'rm -rf "${shim_dir}"' EXIT
            export STRAVIA_REAL_CLANG="$(command -v clang)"
            cp .github/scripts/xwin_clang_wrapper.sh "${shim_dir}/clang"
            chmod +x "${shim_dir}/clang"
            export PATH="${shim_dir}:${PATH}"
          fi
          cargo xwin build --locked -p stravia-server --release --target ${{ matrix.target }}

      - name: Package server artifact
        shell: bash
        env:
          ASSET_BASENAME: stravia-server-v${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          BINARY_PATH: ${{ matrix.binary }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p "package/${ASSET_BASENAME}" dist
          if [[ "${ARCHIVE_KIND}" == "tar.gz" ]]; then
            install -m 0755 "${BINARY_PATH}" "package/${ASSET_BASENAME}/stravia-server"
            install -m 0644 LICENSE "package/${ASSET_BASENAME}/LICENSE"
            tar -C package -czf "dist/${ASSET_BASENAME}.tar.gz" "${ASSET_BASENAME}"
          else
            cp "${BINARY_PATH}" "package/${ASSET_BASENAME}/stravia-server.exe"
            cp LICENSE "package/${ASSET_BASENAME}/LICENSE"
            (cd package && zip -r "../dist/${ASSET_BASENAME}.zip" "${ASSET_BASENAME}")
          fi

      - name: Upload server asset
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Desktop build (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            kind: linux-native
            bundle: appimage
            bundle_directory: appimage
          - suffix: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            kind: linux-native
            bundle: appimage
            bundle_directory: appimage
          - suffix: windows-x86_64
            runner: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            kind: windows-xwin
            bundle: nsis
            bundle_directory: nsis
          - suffix: windows-aarch64
            runner: ubuntu-24.04
            target: aarch64-pc-windows-msvc
            kind: windows-xwin
            bundle: nsis
            bundle_directory: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect persistent host cache volume
        id: host-cache
        shell: bash
        run: |
          if [[ -d "${CI_CACHE_DIR:-/ci-cache}" && -w "${CI_CACHE_DIR:-/ci-cache}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust build toolchain binaries
        if: steps.host-cache.outputs.enabled != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.bun/bin
            ~/.local/bin
          key: toolchain-release-desktop-${{ runner.arch }}-${{ matrix.suffix }}-${{ env.RUST_VERSION }}-xwin${{ env.CARGO_XWIN_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-v1
          restore-keys: |
            toolchain-release-desktop-${{ runner.arch }}-${{ matrix.suffix }}-${{ env.RUST_VERSION }}-

      - name: Bootstrap desktop build toolchain
        id: bootstrap
        env:
          NEED_LINUX_DESKTOP: ${{ startsWith(matrix.kind, 'linux-') && '1' || '0' }}
          NEED_XWIN: ${{ startsWith(matrix.kind, 'windows-') && '1' || '0' }}
          RUST_TARGETS: "wasm32-wasip2 ${{ matrix.target }}"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo, sccache, Bun, and xwin SDK
        if: steps.bootstrap.outputs.host_cache != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sccache
            ~/.cache/cargo-xwin
            ~/.bun/install/cache
          key: release-desktop-${{ runner.arch }}-${{ matrix.suffix }}-v1-${{ hashFiles('Cargo.lock', 'bun.lock', 'patches/*+*.patch', '.cargo/config.toml') }}
          restore-keys: |
            release-desktop-${{ runner.arch }}-${{ matrix.suffix }}-v1-

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_updater_signing.py

      - name: Prepare patched crates, WebUI, and bundled vendors
        run: |
          task prepare:crates
          task install:web
          task build:vendors

      - name: Build desktop bundle (Linux native AppImage)
        if: matrix.kind == 'linux-native'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: task build:desktop CONFIG=tauri.release.conf.json BUNDLES=appimage RUST_TARGET=${{ matrix.target }}

      - name: Build desktop bundle (Windows NSIS via cargo-xwin)
        if: matrix.kind == 'windows-xwin'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-pc-windows-msvc" ]]; then
            shim_dir="$(mktemp -d)"
            trap 'rm -rf "${shim_dir}"' EXIT
            export STRAVIA_REAL_CLANG="$(command -v clang)"
            cp .github/scripts/xwin_clang_wrapper.sh "${shim_dir}/clang"
            chmod +x "${shim_dir}/clang"
            export PATH="${shim_dir}:${PATH}"
          fi
          cd backend/apps/stravia-desktop
          bunx --bun @tauri-apps/cli@2.12.6 build \
            --runner cargo-xwin \
            --target ${{ matrix.target }} \
            --config tauri.release.conf.json \
            --bundles nsis -- --locked

      - name: Collect desktop bundle
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          BUNDLE_DIR: ${{ matrix.bundle_directory }}
          IS_WINDOWS: ${{ startsWith(matrix.kind, 'windows-') && '1' || '0' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          if [[ "${IS_WINDOWS}" == "1" ]]; then
            bundles=(target/"${TARGET_TRIPLE}"/release/bundle/"${BUNDLE_DIR}"/*-setup.exe)
            asset="stravia-desktop-v${VERSION}-${SUFFIX}-setup.exe"
          else
            bundles=(target/"${TARGET_TRIPLE}"/release/bundle/"${BUNDLE_DIR}"/*.AppImage)
            asset="stravia-desktop-v${VERSION}-${SUFFIX}.AppImage"
          fi
          if [[ ${#bundles[@]} -ne 1 ]]; then
            printf 'Expected exactly one bundle in target/%s/release/bundle/%s, found %s\n' \
              "${TARGET_TRIPLE}" "${BUNDLE_DIR}" "${#bundles[@]}" >&2
            exit 1
          fi
          cp "${bundles[0]}" "dist/${asset}"
          cp "${bundles[0]}.sig" "dist/${asset}.sig"

      - name: Upload desktop asset
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-macos-cross:
    name: Desktop cross-build (${{ matrix.suffix }}, osxcross)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: darwin-aarch64
            target: aarch64-apple-darwin
            arch: arm64
            cmake_file: .github/cmake/macos-aarch64.cmake
          - suffix: darwin-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
            cmake_file: .github/cmake/macos-x86_64.cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect persistent host cache volume
        id: host-cache
        shell: bash
        run: |
          if [[ -d "${CI_CACHE_DIR:-/ci-cache}" && -w "${CI_CACHE_DIR:-/ci-cache}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust + rcodesign toolchain binaries
        if: steps.host-cache.outputs.enabled != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.bun/bin
            ~/.local/bin
          key: toolchain-macos-${{ matrix.suffix }}-${{ env.RUST_VERSION }}-rcodesign${{ env.APPLE_CODESIGN_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-v1
          restore-keys: |
            toolchain-rust-${{ env.RUST_VERSION }}-patch${{ env.PATCH_CRATE_VERSION }}-sccache${{ env.SCCACHE_VERSION }}-bun${{ env.BUN_VERSION }}-task${{ env.TASK_VERSION }}-wasip2-v1-

      - name: Restore osxcross toolchain cache (when not prebuilt in image)
        if: steps.host-cache.outputs.enabled != 'true'
        uses: actions/cache@v6
        with:
          path: /opt/osxcross/target
          key: osxcross-899260ca-sdk15.5-linux-x64-v1-${{ matrix.suffix }}
          restore-keys: |
            osxcross-899260ca-sdk15.5-linux-x64-v1-

      - name: Bootstrap Linux x64 macOS cross-compile toolchain (osxcross + MacOSX15.5 SDK)
        id: bootstrap
        env:
          NEED_MACOS_CROSS: "1"
          RUST_TARGETS: "wasm32-wasip2 ${{ matrix.target }}"
          MACOS_SDK_URL: ${{ vars.MACOS_SDK_URL || 'https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz' }}
          MACOS_SDK_SHA256: ${{ vars.MACOS_SDK_SHA256 || 'c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd' }}
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo, sccache, and Bun
        if: steps.bootstrap.outputs.host_cache != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sccache
            ~/.bun/install/cache
          key: release-macos-${{ matrix.suffix }}-v1-${{ hashFiles('Cargo.lock', 'bun.lock', 'patches/*+*.patch', '.cargo/config.toml') }}
          restore-keys: |
            release-macos-${{ matrix.suffix }}-v1-

      - name: Validate updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/configure_updater_signing.py

      - name: Prepare patched crates, WebUI, and bundled vendors
        run: |
          task prepare:crates
          task build:web
          task build:vendors

      - name: Cross-compile macOS desktop binary via osxcross
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/${{ matrix.cmake_file }}
        run: cargo build --locked -p stravia-desktop --release --target ${{ matrix.target }}

      - name: Package .app, rcodesign (Hardened Runtime + entitlements), updater archive, and .dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python3 .github/scripts/package_macos_cross.py \
            --binary "target/${{ matrix.target }}/release/stravia-desktop" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output-dir dist

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker cross-validation (${{ matrix.platform }})
    if: needs.prepare.outputs.publish != 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image via BuildKit cross-compilation without publishing
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx build \
            --platform "${PLATFORM}" \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            .

  collect-assets:
    name: Collect release assets
    needs:
      - prepare
      - build-server
      - build-desktop
      - build-macos-cross
      - build-vendor-plugins
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build-server.result == 'success' && needs.build-desktop.result == 'success' && needs.build-vendor-plugins.result == 'success' && (needs.build-macos-cross.result == 'success' || needs.build-macos-cross.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v7

      - name: Download server linux-x86_64-gnu
        uses: actions/download-artifact@v8
        with:
          name: server-linux-x86_64-gnu
          path: release-assets

      - name: Download server linux-aarch64-gnu
        uses: actions/download-artifact@v8
        with:
          name: server-linux-aarch64-gnu
          path: release-assets

      - name: Download server windows-x86_64
        uses: actions/download-artifact@v8
        with:
          name: server-windows-x86_64
          path: release-assets

      - name: Download server windows-aarch64
        uses: actions/download-artifact@v8
        with:
          name: server-windows-aarch64
          path: release-assets

      - name: Download desktop linux-x86_64
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x86_64
          path: release-assets

      - name: Download desktop linux-aarch64
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-aarch64
          path: release-assets

      - name: Download desktop windows-x86_64
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-x86_64
          path: release-assets

      - name: Download desktop windows-aarch64
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-aarch64
          path: release-assets

      - name: Download desktop darwin-aarch64
        if: needs.prepare.outputs.include_macos == 'true'
        uses: actions/download-artifact@v8
        with:
          name: desktop-darwin-aarch64
          path: release-assets

      - name: Download desktop darwin-x86_64
        if: needs.prepare.outputs.include_macos == 'true'
        uses: actions/download-artifact@v8
        with:
          name: desktop-darwin-x86_64
          path: release-assets

      - name: Download selection marker
        uses: actions/download-artifact@v8
        with:
          name: vendor-plugin-selection
          path: release-assets

      - name: Download dedicated plugin assets
        if: needs.build-vendor-plugins.outputs.has_plugins == 'true'
        uses: actions/download-artifact@v8
        with:
          name: vendor-plugins
          path: release-assets

      - name: Generate updater manifest and SHA256SUMS
        shell: bash
        env:
          INCLUDE_MACOS: ${{ needs.prepare.outputs.include_macos }}
        run: |
          set -euo pipefail
          platforms="linux-x86_64,linux-aarch64,windows-x86_64,windows-aarch64"
          if [[ "${INCLUDE_MACOS}" == "true" ]]; then
            platforms="${platforms},darwin-aarch64,darwin-x86_64"
          fi
          python3 .github/scripts/generate_updater_manifest.py \
            --artifacts release-assets \
            --version "${{ needs.prepare.outputs.version }}" \
            --published-at "${{ needs.prepare.outputs.published_at }}" \
            --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --platforms "${platforms}" \
            --output release-assets/stravia-updater.json
          cd release-assets
          LC_ALL=C sha256sum -- * > SHA256SUMS

      - name: Upload consolidated release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  prepare-draft:
    name: Prepare draft release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - collect-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Compose release notes & sync draft release
        shell: bash
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_api.py compose-notes \
            --changelog CHANGELOG.md \
            --version "${VERSION}" \
            --tag "${TAG_NAME}" \
            --output "${RUNNER_TEMP}/release-notes.md"
          python3 .github/scripts/release_api.py upsert-draft \
            --tag "${TAG_NAME}" \
            --title "Stravia ${TAG_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease "${IS_PRERELEASE}" \
            --assets-dir release-assets

  publish-image:
    name: Publish multi-arch container image
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - prepare-draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_TOKEN || github.token }}
        run: echo "${REGISTRY_PASS}" | docker login "${CONTAINER_REGISTRY}" -u "${REGISTRY_USER}" --password-stdin

      - name: Build and push multi-architecture image from Linux x64
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          MINOR: ${{ needs.prepare.outputs.minor }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          image_name="${IMAGE_NAME,,}"
          tags=(--tag "${image_name}:${VERSION}")
          if [[ "${PRERELEASE}" == "false" ]]; then
            tags+=(
              --tag "${image_name}:${MAJOR}.${MINOR}"
              --tag "${image_name}:${MAJOR}"
              --tag "${image_name}:latest"
            )
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            "${tags[@]}" \
            .

  publish-release:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - publish-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release helper
        uses: actions/checkout@v7

      - name: Publish completed draft
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          python3 .github/scripts/release_api.py publish \
            --tag "${TAG_NAME}" \
            --prerelease "${IS_PRERELEASE}"
