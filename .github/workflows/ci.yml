name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache_warm:
        description: Warm only the selected cache's natural writer
        type: choice
        default: none
        options:
          - none
          - linux-test
          - linux-e2e
          - windows-debug
          - stable-registry
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.98.1"
  BUN_VERSION: "1.4.0"
  TASK_VERSION: "3.52.0"
  UV_VERSION: "0.11.28"
  CACHE_WRITE_ALLOWED: ${{ github.repository == 'Stravia-AI/StraviaPlatform' && github.ref == 'refs/heads/main' && github.workflow_ref == 'Stravia-AI/StraviaPlatform/.github/workflows/ci.yml@refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_warm != '' && inputs.cache_warm != 'none')) }}

jobs:
  check:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-shared-key: ci-v1-linux-gnu-pinned-test
          cache-targets: 'true'
          cache-save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'
          components: rustfmt

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: ${{ env.CACHE_WRITE_ALLOWED != 'true' }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev cmake clang libclang-dev golang python3 libfontconfig1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run static checks
        run: task check

      - name: Test updater manifest generator
        run: python3 .github/scripts/test_generate_updater_manifest.py

  unit-tests:
    if: ${{ always() && !cancelled() && !failure() && (((github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') && needs.check.result == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.cache_warm == 'linux-test' || inputs.cache_warm == 'stable-registry'))) }}
    name: Unit tests (Rust ${{ matrix.toolchain }})
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-test' && '["1.98.1"]' || github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'stable-registry' && '["stable"]' || '["1.98.1", "stable"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          cache-shared-key: ${{ matrix.toolchain == 'stable' && 'ci-v1-linux-gnu-stable-registry' || 'ci-v1-linux-gnu-pinned-test' }}
          cache-targets: ${{ matrix.toolchain != 'stable' }}
          cache-save-if: ${{ env.CACHE_WRITE_ALLOWED == 'true' }}
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        if: matrix.toolchain == '1.98.1'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        if: matrix.toolchain == '1.98.1'
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev golang python3 libfontconfig1-dev

      - name: Run locked unit test suite
        if: matrix.toolchain == '1.98.1'
        run: task test

      - name: Run Rust compatibility tests
        if: matrix.toolchain == 'stable'
        run: cargo test --locked --workspace --exclude stravia-desktop

  web-access-browser:
    if: ${{ always() && !cancelled() && !failure() && (((github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') && needs.check.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'windows-debug')) }}
    name: Embedded Moli Web Access
    needs: check
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install NASM for BoringSSL
        run: |
          choco install nasm --yes --no-progress
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          & (Join-Path $nasmDirectory 'nasm.exe') -v
          $nasmDirectory >> $env:GITHUB_PATH

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-shared-key: ci-v1-windows-msvc-pinned-debug
          cache-targets: 'true'
          cache-save-if: ${{ env.CACHE_WRITE_ALLOWED == 'true' }}
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Run real browser regression tests
        run: cargo test --locked -p stravia-web-access browser::tests

  backend-e2e:
    if: ${{ always() && !cancelled() && !failure() && (((github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') && needs.unit-tests.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-e2e')) }}
    name: Backend E2E (${{ matrix.suite }})
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-e2e' && '["admin"]' || '["proxy", "admin", "storage:sqlite"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-shared-key: ci-v1-linux-gnu-pinned-e2e-mixed
          cache-targets: 'true'
          cache-save-if: ${{ env.CACHE_WRITE_ALLOWED == 'true' && matrix.suite == 'admin' }}
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: 'true'
          restore-cache: 'true'
          save-cache: ${{ env.CACHE_WRITE_ALLOWED == 'true' && matrix.suite == 'admin' }}
          cache-python: 'false'

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev golang python3 libfontconfig1-dev

      - name: Run backend E2E suite
        run: task test:e2e:${{ matrix.suite }}

  postgres-e2e:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: PostgreSQL E2E
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stravia
          POSTGRES_PASSWORD: stravia
          POSTGRES_DB: stravia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-shared-key: ci-v1-linux-gnu-pinned-e2e-mixed
          cache-targets: 'true'
          cache-save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: 'true'
          restore-cache: 'true'
          save-cache: 'false'
          cache-python: 'false'

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev golang python3 libfontconfig1-dev

      - name: Run PostgreSQL E2E suite
        run: task test:e2e:storage:postgres
        env:
          DB_URL: postgresql://stravia:stravia@localhost:5432/stravia_test

  webui-e2e:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: WebUI E2E
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Install locked WebUI dependencies
        run: bun ci

      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          bun run playwright:install:web -- --with-deps chromium

      - name: Run WebUI E2E tests
        run: bun run test:e2e:web

  desktop-smoke:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: Windows desktop smoke
    needs: check
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install NASM for BoringSSL
        run: |
          choco install nasm --yes --no-progress
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          & (Join-Path $nasmDirectory 'nasm.exe') -v
          $nasmDirectory >> $env:GITHUB_PATH

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-shared-key: ci-v1-windows-msvc-pinned-debug
          cache-targets: 'true'
          cache-save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: ${{ env.CACHE_WRITE_ALLOWED != 'true' }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Run Windows desktop smoke test
        run: task test:e2e:desktop
