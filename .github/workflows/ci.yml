  postgres-e2e:
    name: PostgreSQL E2E
    needs: [changes, rust-ci]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stravia
          POSTGRES_PASSWORD: stravia
          POSTGRES_DB: stravia_test
        options: >-
          --health-cmd "pg_isready -U stravia -d stravia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap uv & Bun (no Rust needed)
        id: bootstrap
        env:
          NEED_RUST: "0"
          NEED_UV: "1"
          NEED_BUN: "1"
          NEED_TASK: "0"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: ci-uv-v1-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ci-uv-v1-

      - name: Download shared E2E binaries
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: e2e-binaries-linux-x64
          path: .

      - name: Ensure executable permissions
        run: chmod +x target/test-artifacts/services/*

      - name: Wait for PostgreSQL and Redis services
        run: |
          python3 - <<'PY'
          import socket
          import time

          def wait_tcp(host: str, port: int, *, probe: bytes | None = None, expect: bytes | None = None) -> None:
              deadline = time.monotonic() + 60.0
              while True:
                  try:
                      with socket.create_connection((host, port), timeout=2.0) as sock:
                          if probe is not None:
                              sock.sendall(probe)
                              reply = sock.recv(64)
                              if expect is not None and expect not in reply:
                                  raise OSError(f"unexpected reply from {host}:{port}: {reply!r}")
                          return
                  except OSError as exc:
                      if time.monotonic() >= deadline:
                          raise SystemExit(f"Service {host}:{port} not ready after 60s: {exc}")
                      time.sleep(1.0)

          wait_tcp("postgres", 5432)
          wait_tcp("redis", 6379, probe=b"PING\r\n", expect=b"PONG")
          PY

      - name: Prepare isolated PostgreSQL worker databases
        env:
          POSTGRES_ADMIN_URL: postgresql://stravia:stravia@postgres:5432/stravia_test
        run: |
          uv run --locked --group test python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          import psycopg

          admin_url = os.environ["POSTGRES_ADMIN_URL"]
          workers = ["master", "gw0", "gw1", "gw2", "gw3"]
          deadline = time.monotonic() + 60.0
          while True:
              try:
                  conn = psycopg.connect(admin_url, autocommit=True)
                  break
              except psycopg.OperationalError as exc:
                  if time.monotonic() >= deadline:
                      raise SystemExit(f"PostgreSQL did not accept connections after 60s: {exc}")
                  time.sleep(1.0)

          urls: dict[str, str] = {}
          with conn:
              with conn.cursor() as cur:
                  for worker in workers:
                      db = f"stravia_storage_{worker}"
                      cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
                      if cur.fetchone() is None:
                          cur.execute(f'CREATE DATABASE "{db}" OWNER stravia')
                      urls[worker] = f"postgresql://stravia:stravia@postgres:5432/{db}"

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"STRAVIA_STORAGE_TEST_POSTGRES_URLS={json.dumps(urls)}\n")
          PY

      - name: Run PostgreSQL E2E suite
        env:
          DB_URL: postgresql://stravia:stravia@postgres:5432/stravia_test
          STRAVIA_TEST_REDIS_URL: redis://redis:6379/0
          STRAVIA_BINARY: ${{ github.workspace }}/target/test-artifacts/services/stravia-server
          STRAVIA_TOOLS_BINARY: ${{ github.workspace }}/target/test-artifacts/services/stravia-tools
          STRAVIA_STORAGE_HARNESS_BINARY: ${{ github.workspace }}/target/test-artifacts/services/stravia-storage-test-harness
        run: bun tests/common/run-in-tempdir.ts uv run --locked --group test python -m pytest tests/e2e/storage -q -n 4 --dist loadgroup --durations=0 -m storage -k postgres

