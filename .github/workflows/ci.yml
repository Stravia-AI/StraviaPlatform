            .task/checksum/build-vendors-all
            .task/checksum/build-vendor-fixtures
          key: vendor-fixtures-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'patches/*+*.patch', '.cargo/config.toml', 'backend/crates/stravia-vendor-*/**', 'backend/crates/stravia-protocol-codec/**', 'backend/crates/stravia-runtime-contract/**', 'backend/crates/stravia-core/assets/providers.stravia.json', 'frontend/stravia-webui/src/assets/icons/*.svg', 'tests/common/build-plugin-marketplace-fixtures.ts') }}

      - name: Restore Windows x86_64 sccache (rolling)
        id: sccache-cache
        if: steps.bootstrap.outputs.sccache_remote != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/sccache
          key: sccache-windows-x86_64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-kvm
          restore-keys: |
            sccache-windows-x86_64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-windows-x86_64-

      - name: Prepare patched crates and fixtures
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          bash .github/scripts/prepare_cargo_deps.sh
          task build:vendor-fixtures
          task build:web:desktop-e2e

      - name: Cross-compile Windows desktop E2E binary
        run: |
          cd backend/apps/stravia-desktop
          bunx --bun @tauri-apps/cli@2.12.6 build \
            --ci --debug --no-bundle \
            --runner cargo-xwin \
            --target x86_64-pc-windows-msvc \
            --config tauri.e2e.conf.json -- --locked

      - name: Cross-compile Windows storage test harness
        run: cargo xwin build --locked -p stravia-server --bin stravia-storage-test-harness --features stravia-server/test-harness --target x86_64-pc-windows-msvc

      - name: Run Windows Desktop E2E inside ephemeral KVM Windows guest
        env:
          WINDOWS_BASE_IMAGE: ${{ vars.WINDOWS_KVM_BASE_IMAGE || '/opt/stravia-win-vm/win10-ltsc-2021-e2e-golden.qcow2' }}
          WINDOWS_DEPS_CACHE_DIR: ${{ vars.WINDOWS_KVM_DEPS_CACHE_DIR }}
          WINDOWS_SSH_KEY: ${{ vars.WINDOWS_KVM_SSH_KEY_PATH }}
          WINDOWS_SSH_USER: ${{ vars.WINDOWS_KVM_SSH_USER || 'stravia' }}
          WINDOWS_SUITES: ${{ vars.WINDOWS_KVM_SUITES || 'desktop,legacy,database,storage-failures' }}
          DESKTOP_EXE: target/x86_64-pc-windows-msvc/debug/stravia-desktop.exe
          HARNESS_EXE: target/x86_64-pc-windows-msvc/debug/stravia-storage-test-harness.exe
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1 || ! command -v qemu-img >/dev/null 2>&1 || ! command -v genisoimage >/dev/null 2>&1 || ! command -v ssh >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-x86 qemu-utils genisoimage openssh-client
          fi
          if [[ -z "${WINDOWS_DEPS_CACHE_DIR}" && -d /var/cache/stravia-win-vm ]]; then
            export WINDOWS_DEPS_CACHE_DIR=/var/cache/stravia-win-vm/deps-cache
          fi
          bash .github/scripts/kvm_windows_e2e.sh

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-windows-x86_64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Windows x86_64 sccache (rolling, even on test failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-windows-x86_64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-kvm

  prepare-macos-assets:
    name: Build shared WebUI & bundled vendor for macOS smoke
    needs: changes
    if: ${{ github.server_url != 'https://github.com' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.reuse_covers_macos != 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_macos_cross_smoke)) }}
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap Linux x64 toolchain
        id: bootstrap
        env:
          RUST_TARGETS: "wasm32-wasip2"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Restore Linux x64 wasm sccache (rolling)
        id: sccache-cache
        if: steps.bootstrap.outputs.sccache_remote != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-wasm-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-macos-shared
          restore-keys: |
            sccache-linux-x64-wasm-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-x64-wasm-

      - name: Restore compiled Wasm vendor plugins
        id: vendor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/vendor-plugins
            .task/checksum/build-vendors
          key: vendor-fixtures-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'patches/*+*.patch', '.cargo/config.toml', 'backend/crates/stravia-vendor-*/**', 'backend/crates/stravia-protocol-codec/**', 'backend/crates/stravia-runtime-contract/**', 'backend/crates/stravia-core/assets/providers.stravia.json', 'frontend/stravia-webui/src/assets/icons/*.svg', 'tests/common/build-plugin-marketplace-fixtures.ts') }}

      - name: Build WebUI dist and bundled base Wasm vendor once
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          bash .github/scripts/prepare_cargo_deps.sh
          task install:web
          task build:web
          task build:vendors

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-x64-wasm-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux x64 wasm sccache (rolling)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-wasm-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-macos-shared

      - name: Upload shared macOS smoke assets
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: macos-smoke-shared-assets
          path: |
            frontend/stravia-webui/dist
            target/vendor-plugins
          if-no-files-found: error
          retention-days: 1

  macos-cross-smoke:
    name: macOS cross-compile & rcodesign/DMG smoke (${{ matrix.suffix }})
    needs: [changes, prepare-macos-assets]
    if: ${{ github.server_url != 'https://github.com' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.reuse_covers_macos != 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_macos_cross_smoke)) }}
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: darwin-aarch64
            target: aarch64-apple-darwin
            arch: arm64
            cmake_file: .github/cmake/macos-aarch64.cmake
          - suffix: darwin-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
            cmake_file: .github/cmake/macos-x86_64.cmake
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download shared WebUI dist & bundled vendors
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: macos-smoke-shared-assets
          path: .

      - name: Restore osxcross toolchain cache (when not prebuilt in image)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/osxcross/target
          key: osxcross-899260ca-sdk15.5-linux-x64-v1
          restore-keys: |
            osxcross-899260ca-sdk15.5-linux-x64-v1

      - name: Bootstrap Linux x64 macOS cross-compile toolchain (osxcross + MacOSX15.5 SDK)
        id: bootstrap
        env:
          NEED_BUN: "0"
          NEED_MACOS_CROSS: "1"
          RUST_TARGETS: "${{ matrix.target }}"
          MACOS_SDK_URL: ${{ vars.MACOS_SDK_URL || 'https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz' }}
          MACOS_SDK_SHA256: ${{ vars.MACOS_SDK_SHA256 || 'c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd' }}
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Cargo registry and patched crates
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Restore macOS sccache (rolling)
        id: sccache-cache
        if: steps.bootstrap.outputs.sccache_remote != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/sccache
          key: sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-macos-${{ matrix.suffix }}-

      - name: Prepare patched crates
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: bash .github/scripts/prepare_cargo_deps.sh

      - name: Cross-compile macOS desktop binary via osxcross
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/${{ matrix.cmake_file }}
        run: cargo build --locked -p stravia-desktop --release --target ${{ matrix.target }}

      - name: Assemble .app, codesign (Hardened Runtime + entitlements), and build .dmg
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          python3 .github/scripts/package_macos_cross.py \
            --binary "target/${{ matrix.target }}/release/stravia-desktop" \
            --arch "${{ matrix.arch }}" \
            --version "${version}" \
            --output-dir dist \
            --skip-updater-sign
          ls -lh dist/

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save macOS sccache (rolling, even on test failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-macos-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
