name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      cache_warm:
        description: Warm only the selected cache's natural writer
        type: choice
        default: none
        options:
          - none
          - linux-test
          - linux-e2e
          - windows-debug
          - linux-stable
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.cache_warm || 'none' }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.4.2"
  TASK_VERSION: "3.52.0"
  UV_VERSION: "0.11.28"
  CACHE_WRITE_ALLOWED: ${{ github.repository == 'Stravia-AI/StraviaPlatform' && github.ref == 'refs/heads/main' && github.workflow_ref == 'Stravia-AI/StraviaPlatform/.github/workflows/ci.yml@refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  reuse-ci:
    name: Select complete CI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      run_checks: ${{ steps.reuse.outputs.run_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reuse complete CI for the same commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/reuse_ci.py

  check:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test patched crate preparation
        run: python3 -m unittest tests.test_prepare_crates

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-wasip2
          cache: false
          components: rustfmt, clippy

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-v2-linux-gnu-pinned-test-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: ${{ env.CACHE_WRITE_ALLOWED != 'true' }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev cmake clang libclang-dev python3 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run static checks
        run: task check

      - name: Test updater manifest generator
        run: python3 .github/scripts/test_generate_updater_manifest.py

      - name: Test complete CI reuse
        run: python3 .github/scripts/test_reuse_ci.py

  unit-tests:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none' || inputs.cache_warm == 'linux-test' || inputs.cache_warm == 'linux-stable') }}
    name: Unit tests (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    env:
      # rust-toolchain.toml pins the workspace, so make the matrix selection
      # explicit for every Rust command (including cargo children).
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-test' && '["1.99.1"]' || github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-stable' && '["stable"]' || '["1.99.1", "stable"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: wasm32-wasip2
          cache: false

      - name: Determine unit lane work
        id: unit-lane
        shell: bash
        env:
          MATRIX_TOOLCHAIN: ${{ matrix.toolchain }}
          PINNED_RELEASE: ${{ env.RUST_VERSION }}
          PREWARM_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-stable' }}
        run: |
          set -euo pipefail
          rustup show active-toolchain
          release="$(rustc -vV | sed -n 's/^release: //p')"
          test -n "$release"
          stable_differs=false
          if [[ "$release" != "$PINNED_RELEASE" ]]; then
            stable_differs=true
          fi
          # A selected linux-stable cache warm still compiles the lane even
          # when stable currently resolves to the pinned release.
          run_expensive=true
          if [[ "$MATRIX_TOOLCHAIN" != "$PINNED_RELEASE" && "$stable_differs" == false && "$PREWARM_STABLE" != true ]]; then
            run_expensive=false
          fi
          echo "rustc release: $release (pinned: $PINNED_RELEASE)"
          echo "stable differs from pinned: $stable_differs"
          echo "run expensive unit lane work: $run_expensive"
          echo "stable_differs=$stable_differs" >> "$GITHUB_OUTPUT"
          echo "run_expensive=$run_expensive" >> "$GITHUB_OUTPUT"

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        if: steps.unit-lane.outputs.run_expensive == 'true'
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        if: steps.unit-lane.outputs.run_expensive == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Compiler fingerprints separate stable once it differs from pinned.
          shared-key: ci-v2-linux-gnu-pinned-test-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: ${{ env.CACHE_WRITE_ALLOWED == 'true' }}
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        if: steps.unit-lane.outputs.run_expensive == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        if: steps.unit-lane.outputs.run_expensive == 'true'
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install Linux system dependencies
        if: steps.unit-lane.outputs.run_expensive == 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev python3

      - name: Prepare vendor components and test fixtures
        if: steps.unit-lane.outputs.run_expensive == 'true'
        run: task build:vendor-fixtures

      - name: Compile Rust unit tests
        if: steps.unit-lane.outputs.run_expensive == 'true'
        run: cargo test --locked --workspace --exclude stravia-desktop --exclude stravia-vendor-capability-contract-fixture --exclude stravia-vendor-lifecycle-contract-fixture --exclude stravia-vendor-management-contract-fixture --exclude stravia-vendor-manual-contract-fixture --exclude stravia-vendor-net-1-0-compat-fixture --no-run

      # The cache action reads this at job teardown, even if later tests fail.
      - name: Preserve successfully compiled dependencies
        if: steps.unit-lane.outputs.run_expensive == 'true'
        shell: bash
        run: echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"

      - name: Run locked unit test suite
        if: matrix.toolchain == env.RUST_VERSION && steps.unit-lane.outputs.run_expensive == 'true'
        run: task test

      - name: Run Rust compatibility tests
        if: matrix.toolchain != env.RUST_VERSION && steps.unit-lane.outputs.run_expensive == 'true' && steps.unit-lane.outputs.stable_differs == 'true'
        run: cargo test --locked --workspace --exclude stravia-desktop --exclude stravia-vendor-capability-contract-fixture --exclude stravia-vendor-lifecycle-contract-fixture --exclude stravia-vendor-management-contract-fixture --exclude stravia-vendor-manual-contract-fixture --exclude stravia-vendor-net-1-0-compat-fixture

  web-access-browser:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: Headless Chrome Web Access
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NASM for BoringSSL
        run: |
          choco install nasm --yes --no-progress
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          & (Join-Path $nasmDirectory 'nasm.exe') -v
          $nasmDirectory >> $env:GITHUB_PATH

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: false

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-v3-windows-msvc-desktop-browser-debug-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Compile browser regression tests
        run: cargo test --locked -p stravia-web-access browser::tests --no-run

      - name: Run real browser regression tests
        run: cargo test --locked -p stravia-web-access browser::tests -- --ignored
        env:
          STRAVIA_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  backend-e2e:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none' || inputs.cache_warm == 'linux-e2e') }}
    name: Backend E2E (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cache_warm == 'linux-e2e' && '["admin"]' || '["proxy", "admin", "storage:sqlite"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-wasip2
          cache: false

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-v2-linux-gnu-pinned-e2e-mixed-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: ${{ env.CACHE_WRITE_ALLOWED == 'true' && matrix.suite == 'admin' }}
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: 'true'
          restore-cache: 'true'
          save-cache: ${{ env.CACHE_WRITE_ALLOWED == 'true' && matrix.suite == 'admin' }}
          cache-python: 'false'

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev python3

      # 串行准备隔离产物，避免生产构建覆盖带 test-harness 的测试服务。
      - name: Compile E2E cache dependencies
        if: matrix.suite == 'admin'
        run: |
          task build:test:development
          task build:test:services

      - name: Preserve successfully compiled dependencies
        if: matrix.suite == 'admin'
        run: echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"

      # 串行预建 vendor 与 fixture，避免并行测试分支竞争产物目录。
      - name: Prepare vendor components and test fixtures
        if: matrix.suite != 'admin'
        run: task build:vendor-fixtures

      - name: Run backend E2E suite
        if: matrix.suite != 'admin'
        run: task test:e2e:${{ matrix.suite }}

      - name: Run Admin E2E with prepared binaries
        if: matrix.suite == 'admin'
        run: task test:e2e:admin

  postgres-e2e:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: PostgreSQL E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stravia
          POSTGRES_PASSWORD: stravia
          POSTGRES_DB: stravia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 26379:6379
        # Redis defaults to maxmemory=0 and maxmemory-policy=noeviction.
        # Keep this disposable service dedicated to this PostgreSQL test job.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-wasip2
          cache: false

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-v2-linux-gnu-pinned-e2e-mixed-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: 'true'
          restore-cache: 'true'
          save-cache: 'false'
          cache-python: 'false'

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev python3

      # 串行预建 vendor 与 fixture，避免并行测试分支竞争产物目录。
      - name: Prepare vendor components and test fixtures
        run: task build:vendor-fixtures

      - name: Run PostgreSQL E2E suite
        run: task test:e2e:storage:postgres
        env:
          DB_URL: postgresql://stravia:stravia@localhost:5432/stravia_test
          STRAVIA_TEST_REDIS_URL: redis://127.0.0.1:26379/0

  webui-e2e:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none') }}
    name: WebUI E2E
    runs-on: ubuntu-24.04
    # 冷构建生产服务与 test-host 约需 30 分钟，须为完整浏览器套件保留时间。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-wasip2
          cache: false

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-v2-linux-gnu-pinned-e2e-mixed-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: 'false'
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install locked WebUI dependencies
        run: task install:web

      - name: Install Linux system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang libclang-dev python3

      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          bun run playwright:install:web -- --with-deps chromium

      - name: Prepare production and test-host servers
        run: |
          task build:test:release
          task build:test:services

      - name: Run WebUI E2E tests
        run: task test:e2e:web

  desktop-smoke:
    needs: reuse-ci
    if: ${{ needs.reuse-ci.outputs.run_checks == 'true' && (github.event_name != 'workflow_dispatch' || inputs.cache_warm == '' || inputs.cache_warm == 'none' || inputs.cache_warm == 'windows-debug') }}
    name: Windows desktop smoke
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NASM for BoringSSL
        run: |
          choco install nasm --yes --no-progress
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          & (Join-Path $nasmDirectory 'nasm.exe') -v
          $nasmDirectory >> $env:GITHUB_PATH

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-wasip2
          cache: false

      - name: Normalize installed Rust toolchains
        run: python .github/scripts/normalize_rust_toolchains.py

      - name: Prepare patched crates
        run: python patches/cargo/prepare.py

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-v3-windows-msvc-desktop-browser-debug-${{ hashFiles('patches/cargo/**') }}
          cache-targets: 'true'
          save-if: ${{ env.CACHE_WRITE_ALLOWED == 'true' }}
          cache-on-failure: 'false'
          cache-bin: 'false'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: ${{ env.CACHE_WRITE_ALLOWED != 'true' }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Prepare desktop vendor test fixtures
        run: task build:vendor-fixtures

      # One writer covers both Windows consumers without competing snapshots.
      - name: Compile Windows desktop and browser dependencies
        run: |
          task build:desktop:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p stravia-web-access browser::tests --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve successfully compiled dependencies
        shell: bash
        run: echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"

      - name: Run Windows desktop smoke test
        run: bun run test:e2e:desktop
