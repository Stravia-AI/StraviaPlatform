name: CI

# Unified workflow compatible with both GitHub Actions and Forgejo Actions.
# Uses standard `ubuntu-24.04` runners and standard `actions/*` steps.

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      run_windows_kvm_e2e:
        description: Run Layer-2 Windows Desktop E2E inside an ephemeral KVM guest
        type: boolean
        default: false
      run_macos_cross_smoke:
        description: Run macOS cross-compile & rcodesign/DMG packaging check (osxcross + MacOSX15.5 SDK)
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.4.2"
  TASK_VERSION: "3.52.0"
  UV_VERSION: "0.11.28"
  PATCH_CRATE_VERSION: "0.1.13"
  SCCACHE_VERSION: "0.10.0"
  CARGO_NEXTEST_VERSION: "0.9.152"
  CARGO_XWIN_VERSION: "0.22.0"
  APPLE_CODESIGN_VERSION: "0.29.0"
  XWIN_VERSION: "16"
  # Fallback cap for local disk sccache archives when no remote sccache backend is configured.
  SCCACHE_CACHE_SIZE: "5G"
  CARGO_TERM_COLOR: always
  # Clear any container-baked index override (e.g. domestic PyPI mirror) so `uv run --locked` matches uv.lock.
  UV_DEFAULT_INDEX: ""

jobs:
  # Fast path-filter gate (pure git, works identically on GitHub & Forgejo).
  # Full matrix always runs on main/dev push, workflow_call (releases), and manual dispatch.
  changes:
    name: Detect changed scopes
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      full: ${{ steps.filter.outputs.full }}
      windows_kvm_runner: ${{ steps.filter.outputs.windows_kvm_runner }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      reuse_run_id: ${{ steps.reuse.outputs.reuse_run_id }}
      reuse_covers_macos: ${{ steps.reuse.outputs.reuse_covers_macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check reusable CI for identical commit
        id: reuse
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/reuse_ci.py select \
            --api-url "${GITHUB_API_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-number "${GITHUB_RUN_NUMBER:-0}" \
            --workflow-file "ci.yml"

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          ENABLE_WINDOWS_KVM_E2E: ${{ vars.ENABLE_WINDOWS_KVM_E2E }}
          INPUT_RUN_WINDOWS_KVM_E2E: ${{ inputs.run_windows_kvm_e2e }}
          REUSE_CI: ${{ steps.reuse.outputs.reuse }}
        run: |
          set -euo pipefail
          if [[ "${REUSE_CI}" == "true" ]]; then
            {
              echo "rust=false"
              echo "web=false"
              echo "ci_scripts=false"
              echo "full=false"
              echo "windows_kvm_runner=ubuntu-latest"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kvm_enabled="false"
          if [[ "${ENABLE_WINDOWS_KVM_E2E}" == "true" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_RUN_WINDOWS_KVM_E2E}" == "true" ) ]]; then
            kvm_enabled="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            windows_kvm_runner="ubuntu-latest"
            if [[ "${kvm_enabled}" == "true" ]]; then
              windows_kvm_runner="linux-x64-kvm"
            fi
            {
              echo "rust=true"
              echo "web=true"
              echo "ci_scripts=true"
              echo "full=true"
              echo "windows_kvm_runner=${windows_kvm_runner}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_ref="origin/${GITHUB_BASE_REF:-main}"
          if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}" || true
          fi
          changed="$(git diff --name-only "${base_ref}...HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          echo "Changed files:"
          echo "$changed"

          rust="false"
          web="false"
          ci_scripts="false"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              backend/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|patches/*|tests/e2e/*|tests/common/*|Taskfile.yml|Dockerfile)
                rust="true"
                ;;
              frontend/*|package.json|bun.lock)
                web="true"
                ;;
              .github/scripts/*|.github/workflows/*|.github/cmake/*|.github/docker/*)
                ci_scripts="true"
                rust="true"
                web="true"
                ;;
              docs/*|*.md|LICENSE*)
                ;;
              *)
                rust="true"
                web="true"
                ;;
            esac
          done <<< "$changed"

          # Forgejo evaluates job-level `if:` on the runner rather than the server, so a skipped
          # job targeting an offline `linux-x64-kvm` label would wait forever. Route disabled or
          # out-of-scope runs to `ubuntu-latest` so the runner immediately marks them skipped.
          windows_kvm_runner="ubuntu-latest"
          if [[ "${kvm_enabled}" == "true" && ( "${rust}" == "true" || "${web}" == "true" ) ]]; then
            windows_kvm_runner="linux-x64-kvm"
          fi

          {
            echo "rust=${rust}"
            echo "web=${web}"
            echo "ci_scripts=${ci_scripts}"
            echo "full=false"
            echo "windows_kvm_runner=${windows_kvm_runner}"
          } >> "$GITHUB_OUTPUT"

  # Lightweight gate when reusing an identical-commit main/dev CI run; fails closed if the reused run fails/cancels.
  wait-reused-ci:
    name: Wait for reused CI run
    needs: changes
    if: github.server_url != 'https://github.com' && needs.changes.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout CI reuse script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts/reuse_ci.py
          sparse-checkout-cone-mode: false

      - name: Wait for reused CI run to succeed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/reuse_ci.py wait \
            --api-url "${GITHUB_API_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${{ needs.changes.outputs.reuse_run_id }}" \
            --timeout-seconds 8400

  # Ultra-fast lane: no Rust/GTK needed; cached Bun/Task/ESLint + parallel WebUI checks.
  check-fast:
    name: Fast checks (WebUI lint/typecheck/unit & CI scripts)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci_scripts == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap Bun & Task (no Rust)
        id: bootstrap
        env:
          NEED_RUST: "0"
          NEED_BUN: "1"
          NEED_TASK: "1"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Cache ESLint content cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/eslint
          key: ci-eslint-v1-${{ hashFiles('frontend/stravia-webui/eslint.config.js', 'frontend/stravia-webui/tsconfig*.json') }}
          restore-keys: |
            ci-eslint-v1-

      - name: Run CI script unit tests (GitHub & Forgejo)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Run WebUI typecheck, cached ESLint, format, and unit tests in parallel
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          task install:web
          bun run --filter stravia-webui i18n:check
          bun run --filter stravia-webui i18n:compile
          (cd frontend/stravia-webui && bun --bun run svelte-kit sync)

          pids=()
          names=()
          run_bg() {
            local label="$1"; shift
            ("$@") &
            pids+=("$!")
            names+=("$label")
          }

          run_bg "svelte-check" env -C frontend/stravia-webui bun --bun run svelte-check --tsconfig ./tsconfig.json
          run_bg "eslint" env -C frontend/stravia-webui bun --bun run eslint . --cache --cache-location "${ESLINT_CACHE_DIR}/webui.eslintcache" --cache-strategy content
          run_bg "prettier" bun run format:check:web
          run_bg "webui-unit" bun tests/common/run-in-tempdir.ts bun test --cwd frontend/stravia-webui --isolate ./test

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::WebUI check failed: ${names[$i]}"
              failed=1
            fi
          done
          exit "$failed"

  # Parallel static Rust lane: fmt, WIT compatibility, and clippy run alongside unit tests
  # so downstream E2E suites do not wait behind clippy on the critical path.
  rust-clippy:
    name: Rust fmt, WIT compat & clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap Linux x64 Rust toolchain
        id: bootstrap
        env:
          NEED_LINUX_DESKTOP: "1"
          RUST_TARGETS: "wasm32-wasip2"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Restore Cargo registry and patched crates cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Restore Linux x64 sccache (rolling)
        id: sccache-cache
        if: steps.bootstrap.outputs.sccache_remote != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-clippy
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-x64-

      - name: Restore compiled Wasm vendor plugins
        id: vendor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/vendor-plugins
            .task/checksum/build-vendors
          key: vendor-fixtures-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'patches/*+*.patch', '.cargo/config.toml', 'backend/crates/stravia-vendor-*/**', 'backend/crates/stravia-protocol-codec/**', 'backend/crates/stravia-runtime-contract/**', 'backend/crates/stravia-core/assets/providers.stravia.json', 'frontend/stravia-webui/src/assets/icons/*.svg', 'tests/common/build-plugin-marketplace-fixtures.ts') }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Prepare patched crates and bundled vendor
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          bash .github/scripts/prepare_cargo_deps.sh
          task build:vendors

      - name: Check WIT compatibility and clippy
        run: |
          cargo run --locked -p stravia-devtools --bin stravia-tools -- wit-compat
          cargo clippy --locked --workspace \
            --exclude stravia-vendor-capability-contract-fixture \
            --exclude stravia-vendor-lifecycle-contract-fixture \
            --exclude stravia-vendor-management-contract-fixture \
            --exclude stravia-vendor-manual-contract-fixture \
            --exclude stravia-vendor-net-1-0-compat-fixture \
            --exclude stravia-vendor-state-contract-fixture \
            --all-targets -- -D warnings

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux x64 sccache (rolling, even on lint failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}-clippy

  # Unified Linux Rust test & E2E artifact lane: unit tests (via cargo-nextest), doc tests,
  # and shared E2E service binaries reuse target/, sccache, and prepared Wasm vendors.
  rust-ci:
    name: Rust unit tests & shared E2E build
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap Linux x64 Rust toolchain
        id: bootstrap
        env:
          NEED_LINUX_DESKTOP: "0"
          NEED_NEXTEST: ${{ (needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true') && '1' || '0' }}
          NEED_UV: "1"
          RUST_TARGETS: "wasm32-wasip2"
        run: bash .github/scripts/bootstrap_toolchain.sh

      - name: Restore Cargo registry and patched crates cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}
          restore-keys: |
            deps-cargo-v2-

      - name: Restore Bun package cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-bun-v2-

      - name: Restore Linux x64 sccache (rolling)
        id: sccache-cache
        if: steps.bootstrap.outputs.sccache_remote != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            sccache-linux-x64-

      - name: Restore compiled Wasm vendor plugins & fixtures
        id: vendor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/vendor-plugins
            target/vendor-plugins-all
            target/vendor-test-fixtures
            .task/checksum/build-vendors
            .task/checksum/build-vendors-all
            .task/checksum/build-vendor-fixtures
          key: vendor-fixtures-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'patches/*+*.patch', '.cargo/config.toml', 'backend/crates/stravia-vendor-*/**', 'backend/crates/stravia-protocol-codec/**', 'backend/crates/stravia-runtime-contract/**', 'backend/crates/stravia-core/assets/providers.stravia.json', 'frontend/stravia-webui/src/assets/icons/*.svg', 'tests/common/build-plugin-marketplace-fixtures.ts') }}

      - name: Prepare patched crates and vendor fixtures
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          bash .github/scripts/prepare_cargo_deps.sh
          task build:vendor-fixtures

      - name: Save Cargo registry and patched crates cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/patch
            .task/checksum/prepare-crates
          key: deps-cargo-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'patches/*+*.patch') }}

      - name: Save compiled Wasm vendor plugins & fixtures
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: |
            target/vendor-plugins
            target/vendor-plugins-all
            target/vendor-test-fixtures
            .task/checksum/build-vendors
            .task/checksum/build-vendors-all
            .task/checksum/build-vendor-fixtures
          key: vendor-fixtures-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'patches/*+*.patch', '.cargo/config.toml', 'backend/crates/stravia-vendor-*/**', 'backend/crates/stravia-protocol-codec/**', 'backend/crates/stravia-runtime-contract/**', 'backend/crates/stravia-core/assets/providers.stravia.json', 'frontend/stravia-webui/src/assets/icons/*.svg', 'tests/common/build-plugin-marketplace-fixtures.ts') }}

      - name: Run locked Rust unit test suite
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
        run: |
          bun tests/common/run-in-tempdir.ts cargo nextest run --locked --workspace \
            --exclude stravia-desktop \
            --exclude stravia-vendor-capability-contract-fixture \
            --exclude stravia-vendor-lifecycle-contract-fixture \
            --exclude stravia-vendor-management-contract-fixture \
            --exclude stravia-vendor-manual-contract-fixture \
            --exclude stravia-vendor-net-1-0-compat-fixture \
            --exclude stravia-vendor-state-contract-fixture \
            --no-fail-fast --status-level fail --final-status-level slow
          bun tests/common/run-in-tempdir.ts cargo test --locked --doc --workspace \
            --exclude stravia-desktop \
            --exclude stravia-vendor-capability-contract-fixture \
            --exclude stravia-vendor-lifecycle-contract-fixture \
            --exclude stravia-vendor-management-contract-fixture \
            --exclude stravia-vendor-manual-contract-fixture \
            --exclude stravia-vendor-net-1-0-compat-fixture \
            --exclude stravia-vendor-state-contract-fixture

      - name: Build shared E2E services
        run: |
          task build:test:services
          mkdir -p target/test-artifacts/task-checksums
          cp -f .task/checksum/* target/test-artifacts/task-checksums/

      - name: Save Bun package cache
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: deps-bun-v2-${{ hashFiles('bun.lock') }}

      - name: Upload shared E2E binaries & fixtures
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: e2e-binaries-linux-x64
          path: |
            frontend/stravia-webui/dist
            target/test-artifacts/services
            target/test-artifacts/task-checksums
            target/vendor-plugins
            target/vendor-plugins-all
            target/vendor-test-fixtures
          if-no-files-found: error
          retention-days: 1

      - name: Show sccache stats
        id: sccache-stats
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.sccache-cache.outputs.cache-matched-key }}
          EXPECTED_KEY_PREFIX: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-
        run: bash .github/scripts/sccache_check_save.sh

      - name: Save Linux x64 sccache (rolling, even on test failure)
        if: always() && steps.sccache-stats.outputs.should_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}

  backend-e2e:
    name: Backend E2E (${{ matrix.suite }})
    needs: [changes, rust-ci]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    container:
      image: git.stravia.cn/stravia/stravia-ci:x64
      credentials:
        username: ${{ vars.REGISTRY_PACKAGE_USER || github.actor }}
        password: ${{ secrets.REGISTRY_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - proxy
          - storage:sqlite
    steps:
