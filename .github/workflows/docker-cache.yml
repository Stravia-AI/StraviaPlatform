name: Docker Cache

# Unified workflow compatible with both GitHub Actions and Forgejo Actions.
# Single Linux x64 runner cross-compiles both amd64 and arm64 Docker images.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/**
      - backend/**
      - frontend/**
      - package.json
      - bun.lock
      - .github/workflows/docker-cache.yml
  workflow_dispatch:

concurrency:
  group: docker-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || (github.server_url == 'https://github.com' && 'ghcr.io' || 'codeberg.org') }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME || github.repository }}

jobs:
  build-cache:
    name: Build Docker cache (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.CONTAINER_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push BuildKit cache (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
