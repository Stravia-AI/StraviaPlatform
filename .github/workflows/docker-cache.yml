name: Docker cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/stravia-ai/straviaplatform

jobs:
  warm-cache:
    name: Warm Docker cache (${{ matrix.platform }})
    if: >-
      github.repository == 'Stravia-AI/StraviaPlatform' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'Stravia-AI/StraviaPlatform/.github/workflows/docker-cache.yml@refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-cache-main-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image and export cache only
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
