[workspace]
resolver = "2"
members = ["backend/crates/stravia-core", "backend/crates/stravia-devtools", "backend/apps/stravia-desktop", "backend/apps/stravia-server", "backend/crates/stravia-web-access", "backend/crates/stravia-web-access-contract", "backend/crates/stravia-runtime-contract", "backend/crates/stravia-protocol-codec", "backend/crates/stravia-vendor-sdk", "backend/crates/stravia-vendor-runtime", "backend/crates/stravia-vendor-common", "backend/crates/stravia-vendor-base", "backend/crates/stravia-vendor-codex", "backend/crates/stravia-vendor-grok", "backend/crates/stravia-vendor-command-code", "backend/crates/stravia-vendor-devin", "backend/crates/stravia-vendor-opencode-free", "backend/crates/stravia-vendor-claudecode", "backend/crates/stravia-vendor-antigravity", "backend/crates/stravia-media", "backend/crates/stravia-web-search", "backend/crates/stravia-credential-protection", "backend/crates/stravia-vendor-sdk/fixtures/capability-contract", "backend/crates/stravia-vendor-sdk/fixtures/lifecycle-contract", "backend/crates/stravia-vendor-sdk/fixtures/management-contract"]
# 与 dev:server 保持相同的依赖特性图，避免裸 build 先构建桌面特性并集。
default-members = ["backend/apps/stravia-server"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
stravia-core = { path = "backend/crates/stravia-core" }
stravia-runtime-contract = { path = "backend/crates/stravia-runtime-contract" }
stravia-protocol-codec = { path = "backend/crates/stravia-protocol-codec" }
stravia-vendor-sdk = { path = "backend/crates/stravia-vendor-sdk" }
stravia-vendor-runtime = { path = "backend/crates/stravia-vendor-runtime" }
stravia-vendor-common = { path = "backend/crates/stravia-vendor-common" }
stravia-vendor-base = { path = "backend/crates/stravia-vendor-base" }
stravia-vendor-codex = { path = "backend/crates/stravia-vendor-codex" }
stravia-vendor-grok = { path = "backend/crates/stravia-vendor-grok" }
stravia-vendor-command-code = { path = "backend/crates/stravia-vendor-command-code" }
stravia-vendor-devin = { path = "backend/crates/stravia-vendor-devin" }
stravia-vendor-opencode-free = { path = "backend/crates/stravia-vendor-opencode-free" }
stravia-vendor-claudecode = { path = "backend/crates/stravia-vendor-claudecode" }
stravia-vendor-antigravity = { path = "backend/crates/stravia-vendor-antigravity" }
stravia-media = { path = "backend/crates/stravia-media" }
stravia-web-search = { path = "backend/crates/stravia-web-search" }
stravia-credential-protection = { path = "backend/crates/stravia-credential-protection" }
stravia-server = { path = "backend/apps/stravia-server", default-features = false }
stravia-web-access = { path = "backend/crates/stravia-web-access" }
stravia-web-access-contract = { path = "backend/crates/stravia-web-access-contract" }
tokio = { version = "1", default-features = false }
ammonia = "4.1.4"
axum = { version = "0.8", default-features = false }
rmcp = { version = "=3.5.0", default-features = false }
# 与桌面更新器统一 TLS/代理编译特性；运行时代理由客户端显式选择。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
reqwest-websocket = "0.6"
tungstenite = { version = "0.28", default-features = false }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres", "tls-rustls", "migrate", "macros", "rust_decimal", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
wasmtime = { version = "=49.0.1", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "async", "parallel-compilation"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p2"] }
wasmprinter = "=0.258.0"
wat = "=1.258.0"
serde-saphyr = "1"
json5 = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18.1", default-features = false }
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
rust_decimal = { version = "1.42", features = ["serde-with-arbitrary-precision"] }
anyhow = "1"
fend-core = "1.5.8"
thiserror = "2"
tokio-stream = "0.1"
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
http-body-util = "0.1"
htmd = "0.5"
bytes = "1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { version = "=0.13.3", default-features = false }
# 与 shellexpand 复用 dirs 6；相同的 home_dir 实现无需在服务端额外编译 dirs 7。
dirs = "6"
dom_smoothie = "0.18"
base64 = "0.23"
base64-022 = { package = "base64", version = "0.22.1" }
rand = "0.10"
sha2 = "0.11"
argon2 = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "11", default-features = false }
rpassword = "7.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
office_oxide = "0.1.11"
cfb = "0.14"
zip = { version = "=8.6.0", default-features = false }
dashmap = "6"
inventory = "0.3"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
maud = "0.27.0"
wreq = { version = "=0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "cookies", "socks", "stream", "gzip", "brotli", "deflate", "zstd", "charset", "json", "form", "query"] }
wreq-util = "=0.2.0"
http = "1"
tokio-rustls = "0.26.4"
rustls-platform-verifier = "0.7"
numbat = { version = "1.24.0", default-features = false, features = ["fetch-exchangerates"] }
parking_lot = "0.12.5"
tempfile = "3"
regex = "1.13.1"
tiktoken-rs = "=0.12.1"
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
walkdir = "2"
url = { version = "2", features = ["serde"] }
urlencoding = "2.1.3"
toml = { version = "1.1.4", features = ["std", "parse", "display", "serde"] }
shellexpand = "3"
rust-embed = { version = "8", features = ["compression"] }
listeners = "0.6.1"
local-ip-address = "0.6"
# WebDriver 1.4.0 uses WebView2 0.38 / windows 0.61; Tauri 2.12 upgrades
# WebView2 to 0.39, which makes its Windows bridge types incompatible.
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-build = { version = "2", features = [] }
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"

# 多版本依赖以独立键区分；crate 只继承版本并声明自身所需特性。
bitflags = "2.13.2"
byteorder = "1.5.0"
foldhash = "0.2.0"
serde_core = "1.0.229"
proc-macro2 = "1.0.107"
libc = "0.2.189"
crc32fast = "1.5.2"
regex-automata = "0.4.18"
time = "0.3.55"
windows-sys = "0.61"
windows-sys-052 = { package = "windows-sys", version = "0.52" }
windows = "0.61"
winapi = "0.3.9"
windows-core = "0.61.2"
rustix = "1.1.5"
toml_datetime = "1.1.1"
toml_parser = "1.1.3"
winnow = "1.0.4"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2 = "0.6.4"
jsonschema = { version = "0.58.1", default-features = false }
rcgen = "0.14.5"
wit-bindgen = "0.62.0"
stable_deref_trait = "1.2.1"

[workspace.lints.rust]
# rustc 默认警告由 task check 的 -D warnings 统一升级为错误；
# 此处只列需要偏离默认级别的条目。

[workspace.lints.clippy]
# 默认 warn 的 clippy::all 由 -D warnings 升级为错误；
# 此处只允许当前代码有意违反、且修复收益低于噪音的 lint。
# `let _ =` 丢弃锁 guard 或未驱动的 future 属于真实 bug 类别，直接 deny。
let_underscore_lock = "deny"
let_underscore_future = "deny"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 3
# 工作区保留完整变量调试；依赖精简符号，降低增量构建的 PDB 处理成本。
debug = 1

# Cargo 是否复用运行期产物会影响 bindgen 依赖的默认 debuginfo；
# 固定这两个包，避免仅切换 workspace 成员就让原生 TLS 构建失效。
[profile.dev.package."bitflags@2"]
debug = true

[profile.dev.package.glob]
debug = true
