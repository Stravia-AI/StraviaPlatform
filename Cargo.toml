[workspace]
resolver = "2"
members = ["backend/crates/stravia-core", "backend/crates/stravia-devtools", "backend/apps/stravia-desktop", "backend/apps/stravia-server", "backend/crates/stravia-web-local"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
stravia-core = { path = "backend/crates/stravia-core" }
stravia-server = { path = "backend/apps/stravia-server", default-features = false }
stravia-web-local = { path = "backend/crates/stravia-web-local" }
tokio = { version = "1", features = ["full"] }
ammonia = "4.1.4"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls", "http2", "charset", "form", "multipart"] }
wreq = { version = "6.0.0-rc.31", features = ["brotli", "cookies", "deflate", "gzip", "zstd", "socks"] }
wreq-util = "3.0.0-rc.14"
tokio-tungstenite = "0.30"
reqwest-websocket = "0.6"
tower-http = { version = "0.7", features = ["cors", "trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls", "migrate", "macros", "rust_decimal", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
rust_decimal = { version = "1.42", features = ["serde-with-arbitrary-precision"] }
anyhow = "1"
eyre = "0.6.14"
fend-core = "1.5.8"
thiserror = "2"
tokio-stream = "0.1"
futures = "0.3"
http-body-util = "0.1"
headless_chrome = "1.0.22"
htmd = "0.5"
bytes = "1"
dirs = "6"
dom_smoothie = "0.18"
base64 = "0.23"
rand = "0.10"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dashmap = "6"
inventory = "0.3"
gcp_auth = "0.12.7"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
maud = "0.27.0"
numbat = "1.24.0"
parking_lot = "0.12.5"
tempfile = "3"
regex = "1.13.1"
scraper = "0.27.0"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
walkdir = "2"
url = "2"
urlencoding = "2.1.3"
toml = { version = "1.1.4", default-features = false, features = ["std", "parse", "serde"] }
shellexpand = "3"
rust-embed = { version = "8", features = ["compression"] }
listeners = "0.6.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2"
tauri-build = { version = "2", features = [] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 3
