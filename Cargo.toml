[workspace]
resolver = "2"
members = ["backend/crates/stravia-core", "backend/crates/stravia-devtools", "backend/apps/stravia-desktop", "backend/apps/stravia-server", "backend/crates/stravia-web-access", "backend/crates/stravia-web-access-contract", "backend/crates/stravia-runtime-contract", "backend/crates/stravia-media", "backend/crates/stravia-web-search", "backend/crates/stravia-credential-protection"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
stravia-core = { path = "backend/crates/stravia-core" }
stravia-runtime-contract = { path = "backend/crates/stravia-runtime-contract" }
stravia-media = { path = "backend/crates/stravia-media" }
stravia-web-search = { path = "backend/crates/stravia-web-search" }
stravia-credential-protection = { path = "backend/crates/stravia-credential-protection" }
stravia-server = { path = "backend/apps/stravia-server", default-features = false }
stravia-web-access = { path = "backend/crates/stravia-web-access" }
stravia-web-access-contract = { path = "backend/crates/stravia-web-access-contract" }
tokio = { version = "1", default-features = false }
ammonia = "4.1.4"
axum = { version = "0.8", default-features = false }
rmcp = { version = "=3.1.4", default-features = false }
reqwest = { version = "0.13", default-features = false }
reqwest-websocket = "0.6"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres", "tls-rustls", "migrate", "macros", "rust_decimal", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
serde-saphyr = "1"
json5 = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
rust_decimal = { version = "1.42", features = ["serde-with-arbitrary-precision"] }
anyhow = "1"
fend-core = "1.5.8"
thiserror = "2"
tokio-stream = "0.1"
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
http-body-util = "0.1"
htmd = "0.5"
bytes = "1"
dirs = "6"
dom_smoothie = "0.18"
base64 = "0.23"
rand = "0.10"
sha2 = "0.11"
argon2 = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rpassword = "7.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dashmap = "6"
inventory = "0.3"
gcp_auth = "0.12.7"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
maud = "0.27.0"
moli-core = { git = "https://github.com/Stravia-AI/moli-stealth", rev = "93b3afc10371983795ecfa8ca6591b48a7e2bd2a" }
moli-stealth-net = { git = "https://github.com/Stravia-AI/moli-stealth", rev = "93b3afc10371983795ecfa8ca6591b48a7e2bd2a" }
moli-cookie-jar = { git = "https://github.com/Stravia-AI/moli-stealth", rev = "93b3afc10371983795ecfa8ca6591b48a7e2bd2a" }
http = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = "0.26.4"
rustls-platform-verifier = "0.7"
numbat = { version = "1.24.0", default-features = false, features = ["fetch-exchangerates"] }
parking_lot = "0.12.5"
tempfile = "3"
regex = "1.13.1"
tiktoken-rs = "=0.12.0"
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
walkdir = "2"
url = "2"
urlencoding = "2.1.3"
toml = { version = "1.1.4", default-features = false, features = ["std", "parse", "display", "serde"] }
shellexpand = "3"
rust-embed = { version = "8", features = ["compression"] }
listeners = "0.6.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"

tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-build = { version = "2", features = [] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 3
