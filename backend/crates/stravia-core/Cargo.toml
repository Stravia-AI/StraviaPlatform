[package]
name = "stravia-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for Stravia AI Gateway — protocol conversion, proxy, admin API"

[dependencies]
stravia-web-access = { workspace = true }
stravia-web-access-contract = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
axum = { workspace = true, features = ["json", "query", "ws"] }
rmcp = { workspace = true, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
reqwest = { workspace = true, features = ["charset", "form", "http2", "json", "rustls", "stream"] }
reqwest-websocket = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde-saphyr = { workspace = true }
json5 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
rust_decimal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

tokio-stream = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
dashmap = { workspace = true }
inventory = { workspace = true }
gcp_auth = { workspace = true }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
jsonschema = { version = "0.51.0", default-features = false }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
axum = { workspace = true, features = ["http1"] }
