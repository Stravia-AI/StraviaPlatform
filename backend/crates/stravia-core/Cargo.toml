[package]
name = "stravia-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for Stravia Agent infra — model access, tool execution, built-in agents, and administration"

[lints]
workspace = true

[features]
test-support = ["sqlx/sqlite-deserialize"]

[dependencies]
stravia-runtime-contract = { workspace = true }
stravia-protocol-codec = { workspace = true }
stravia-vendor-sdk = { workspace = true }
stravia-vendor-runtime = { workspace = true }
stravia-media = { workspace = true }
stravia-web-search = { workspace = true }
stravia-credential-protection = { workspace = true }
stravia-web-access = { workspace = true }
stravia-web-access-contract = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
axum = { workspace = true, features = ["json", "query", "ws"] }
rmcp = { workspace = true, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
reqwest = { workspace = true, features = ["charset", "form", "http2", "json", "rustls", "stream"] }
reqwest-websocket = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }
# 插件协商内容编码时由宿主解码响应；这些特性已随 wreq 进入依赖图。
tower-http = { workspace = true, features = ["decompression-br", "decompression-deflate", "decompression-gzip", "decompression-zstd"] }
tower = { workspace = true }
http-body-util = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
semver = { workspace = true }
serde-saphyr = { workspace = true }
json5 = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sysinfo = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
rust_decimal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

tokio-stream = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
dashmap = { workspace = true }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
zstd = { workspace = true }
tempfile = { workspace = true }
parking_lot = { workspace = true }
image = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc", "unbounded_depth"] }
stravia-runtime-contract = { workspace = true }
# 在实际构建脚本中统一宿主依赖特性，避免两端的过程宏和契约库生成不同产物。
base64-022 = { workspace = true }
foldhash = { workspace = true }
serde_core = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
libc = { workspace = true }
crc32fast = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
regex-automata = { workspace = true }
byteorder = { workspace = true }
url = { workspace = true }
stable_deref_trait = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-sys-052 = { workspace = true, features = ["Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemServices"] }

[dev-dependencies]
sqlx = { workspace = true, features = ["sqlite-deserialize"] }
office_oxide = { workspace = true }
stravia-media = { workspace = true, features = ["test-support"] }
jsonschema = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
axum = { workspace = true, features = ["http1"] }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
