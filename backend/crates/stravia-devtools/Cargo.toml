[package]
name = "stravia-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI suite for Stravia development and E2E testing — real LLM recording, offline byte-stream replay, and schema export"

[lints]
workspace = true

[[bin]]
name = "stravia-tools"
path = "src/main.rs"

[dependencies]
stravia-core = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
hpack = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
reqwest = { workspace = true, features = ["http2", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true, features = ["clock", "std"] }
anyhow = { workspace = true }
sqlx = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
shellexpand = { workspace = true }

clap = { workspace = true }
base64 = { workspace = true }
walkdir = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
wit-parser = "=0.258.3"
