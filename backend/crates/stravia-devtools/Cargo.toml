[package]
name = "stravia-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI suite for Stravia development and E2E testing — real LLM recording, offline byte-stream replay, and schema export"

[[bin]]
name = "stravia-tools"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
reqwest = { workspace = true, features = ["http2", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true, features = ["clock", "std"] }
anyhow = { workspace = true }

clap = { workspace = true }
base64 = { workspace = true }
walkdir = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
