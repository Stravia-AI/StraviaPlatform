[package]
name = "stravia-vendor-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fallback Wasm vendor for Stravia built-in provider profiles"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
stravia-vendor-sdk = { workspace = true }
stravia-vendor-common = { workspace = true }
stravia-protocol-codec = { workspace = true }
stravia-runtime-contract = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
semver = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
