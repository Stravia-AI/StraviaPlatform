[package]
name = "stravia-web-access"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Public Web resource fetching, read conversion, and remote MCP HTTP transport"
publish = false

[lints]
workspace = true

[dependencies]
stravia-runtime-contract = { workspace = true }
stravia-web-access-contract = { workspace = true }
bytes = { workspace = true }
dom_smoothie = { workspace = true }
futures = { workspace = true }
htmd = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["http2", "rustls", "stream"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sse-stream = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
