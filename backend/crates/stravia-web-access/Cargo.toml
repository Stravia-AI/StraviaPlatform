[package]
name = "stravia-web-access"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "CC0-1.0 AND MIT"
description = "Web Access adapter implementations for Local, Exa, and Zhipu providers"
publish = false

[dependencies]
stravia-web-access-contract = { workspace = true }
ammonia = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
chrono-tz = { workspace = true }
dom_smoothie = { workspace = true }
fend-core = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
htmd = { workspace = true }
maud = { workspace = true }
wreq = { workspace = true }
wreq-util = { workspace = true }
parking_lot = { workspace = true }
numbat = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["http2", "rustls"] }
reqwest-websocket = { workspace = true }
rustls-platform-verifier = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "process", "io-util", "macros", "fs"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
