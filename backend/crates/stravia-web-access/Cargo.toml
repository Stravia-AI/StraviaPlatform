[package]
name = "stravia-web-access"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "CC0-1.0 AND MIT"
description = "Web Access adapter implementations for Local, Exa, and Zhipu providers"
publish = false

[dependencies]
stravia-web-access-contract = { workspace = true }
ammonia = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
chrono-tz = { workspace = true }
dom_smoothie = { workspace = true }
fend-core = { workspace = true }
futures = { workspace = true }
htmd = { workspace = true }
maud = { workspace = true }
moli-core = { workspace = true }
moli-stealth-net = { workspace = true }
moli-cookie-jar = { workspace = true }
http = { workspace = true }
async-compression = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
numbat = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["http2", "rustls"] }
rustls-platform-verifier = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

# 固定 Moli 原生 TLS 的 bindgen 构建期特性，避免切换 Tauri/server/test 时重编 SSL。
# 这些依赖只参与构建期特性解析，不改变运行期代理、JSON 或测试能力。
[build-dependencies]
libc = "0.2"
regex = { workspace = true }
serde_core = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
