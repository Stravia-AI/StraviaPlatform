[package]
name = "stravia-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stravia AI Gateway — Desktop Application"

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
listeners = { workspace = true }
stravia-core = { workspace = true }
stravia-server = { workspace = true }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-store = { workspace = true }
tokio = { workspace = true }
tauri-plugin-opener = { workspace = true }
tempfile = { workspace = true }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { workspace = true, features = ["macos-private-api"] }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }

[lib]
name = "stravia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
