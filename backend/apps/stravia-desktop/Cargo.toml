[package]
name = "stravia-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stravia Agent infra — Desktop Application"

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
listeners = { workspace = true }
stravia-core = { workspace = true }
stravia-runtime-contract = { workspace = true }
stravia-media = { workspace = true }
stravia-web-search = { workspace = true }
stravia-server = { workspace = true }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tauri-plugin-store = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }


[target.'cfg(target_os = "macos")'.dependencies]
tauri = { workspace = true, features = ["macos-private-api"] }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[lib]
name = "stravia_desktop_lib"
# 桌面二进制通过 Rust 链接此库，避免增量构建额外打包 C ABI 静态库和动态库。
crate-type = ["rlib"]
