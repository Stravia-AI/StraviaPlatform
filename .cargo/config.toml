# Moli 的 V8 Windows 静态归档使用静态 MSVC CRT；Rust 与其他原生依赖必须一致。
# 使用 Rust 工具链自带的 LLD 缩短开发构建的链接时间，同时保留完整 PDB。
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
