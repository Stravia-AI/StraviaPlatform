[project]
name = "stravia-e2e"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
  "pytest==8.4.1",
  "pywinpty>=3.0.5 ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
  "e2e: end-to-end tests",
  "proxy: proxy protocol matrix tests",
  "admin: Admin API tests",
  "storage: storage backend tests",
]
