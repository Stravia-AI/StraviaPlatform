version: "3"

vars:
  DESKTOP_DIR: backend/apps/stravia-desktop
  TAURI_CLI_VERSION: 2.12.3

tasks:
  install:patch-crate:
    desc: Install the pinned Cargo patch manager when absent or outdated.
    status:
      - 'test "$(cargo patch-crate --version)" = "patch-crate 0.1.13"'
    cmds:
      - |
        if [ "$(cargo patch-crate --version 2>/dev/null)" != "patch-crate 0.1.13" ]; then
          cargo install --locked --version 0.1.13 patch-crate
        fi

  prepare:crates:
    desc: Prepare patched Cargo dependencies before resolving the workspace.
    deps: [install:patch-crate]
    run: once
    sources:
      - Cargo.toml
      - Cargo.lock
      - Taskfile.yml
      - patches/*+*.patch
    generates:
      - target/patch/rustls-0.23.46/Cargo.toml
      - target/patch/rama-http-core-0.4.0/Cargo.toml
      - target/patch/rama-http-types-0.4.0/Cargo.toml
    cmds:
      - cargo patch-crate --force
  brand:generate:
    desc: Generate SVG brand variants and required native icons from the Cadence master.
    cmds:
      - bun frontend/stravia-webui/scripts/generate-brand.ts

  install:web:
    desc: Install the locked Bun workspace dependencies.
    # 并行构建分支共享 node_modules，单次调用内必须只安装一次。
    run: once
    # The run launcher also routes dependency lifecycle scripts through Bun.
    cmds:
      - bun --bun run bun ci

  build:vendors:
    desc: Build the bundled Stravia Base Providers Wasm component.
    deps: [prepare:crates]
    sources:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/*+*.patch
      - backend/crates/stravia-vendor-base/Cargo.toml
      - backend/crates/stravia-vendor-base/build.rs
      - backend/crates/stravia-vendor-base/src/**/*.rs
      - backend/crates/stravia-vendor-base/src/assets/**/*.svg
      - frontend/stravia-webui/src/assets/icons/*.svg
      - backend/crates/stravia-vendor-base/messages/*.json
      - backend/crates/stravia-core/assets/providers.stravia.json
      - backend/crates/stravia-vendor-common/Cargo.toml
      - backend/crates/stravia-vendor-common/src/**/*.rs
      - backend/crates/stravia-vendor-sdk/Cargo.toml
      - backend/crates/stravia-vendor-sdk/src/**/*.rs
      - backend/crates/stravia-vendor-sdk/build-support/**/*.rs
      - backend/crates/stravia-vendor-sdk/wit/**/*.wit
      - backend/crates/stravia-protocol-codec/Cargo.toml
      - backend/crates/stravia-protocol-codec/src/**/*.rs
      - backend/crates/stravia-runtime-contract/Cargo.toml
      - backend/crates/stravia-runtime-contract/src/**/*.rs
    generates:
      - target/vendor-plugins/manifest.json
    cmds:
      - cargo run --locked -p stravia-vendor-base --bin stravia-build-vendors

  build:vendors:all:
    desc: Build standalone Wasm plugins for release assets and explicit integration tests.
    deps: [build:vendors]
    sources:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/*+*.patch
      - .cargo/config.toml
      - backend/crates/stravia-vendor-*/Cargo.toml
      - backend/crates/stravia-vendor-*/build.rs
      - backend/crates/stravia-vendor-*/src/**/*.rs
      - backend/crates/stravia-vendor-*/src/assets/**/*.svg
      - frontend/stravia-webui/src/assets/icons/*.svg
      - backend/crates/stravia-vendor-*/messages/*.json
      - backend/crates/stravia-vendor-sdk/build-support/**/*.rs
      - backend/crates/stravia-vendor-sdk/wit/**/*.wit
      - backend/crates/stravia-protocol-codec/Cargo.toml
      - backend/crates/stravia-protocol-codec/src/**/*.rs
      - backend/crates/stravia-runtime-contract/Cargo.toml
      - backend/crates/stravia-runtime-contract/src/**/*.rs
      - backend/crates/stravia-core/assets/providers.stravia.json
    generates:
      - target/vendor-plugins-all/manifest.json
    cmds:
      - cargo run --locked -p stravia-vendor-base --bin stravia-build-vendors -- --all

  build:vendor-fixtures:
    desc: Build real Wasm components for Gateway lifecycle and capability regressions.
    deps: [build:vendors:all]
    sources:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/*+*.patch
      - target/vendor-plugins/manifest.json
      - backend/crates/stravia-vendor-sdk/Cargo.toml
      - backend/crates/stravia-vendor-sdk/fixtures/build.ts
      - backend/crates/stravia-vendor-sdk/fixtures/*/Cargo.toml
      - backend/crates/stravia-vendor-sdk/fixtures/*/build.rs
      - backend/crates/stravia-vendor-sdk/fixtures/*/messages/*.json
      - backend/crates/stravia-vendor-sdk/fixtures/*/src/**/*.rs
      - backend/crates/stravia-vendor-sdk/fixtures/*/wit/**/*.wit
      - backend/crates/stravia-vendor-sdk/src/**/*.rs
      - backend/crates/stravia-vendor-sdk/build-support/**/*.rs
      - backend/crates/stravia-vendor-sdk/wit/**/*.wit
      - backend/crates/stravia-runtime-contract/Cargo.toml
      - backend/crates/stravia-runtime-contract/src/**/*.rs
    generates:
      - target/vendor-test-fixtures/*.wasm
    cmds:
      - bun backend/crates/stravia-vendor-sdk/fixtures/build.ts

  dev:web:
    desc: Start the Stravia WebUI development server.
    deps: [install:web]
    cmds:
      - bun run dev:web

  dev:server:
    desc: Start the Vite WebUI and standalone server in debug mode.
    deps: [install:web, build:vendors:all]
    env:
      STRAVIA_DEV_VENDOR_MANIFEST: "{{.ROOT_DIR}}/target/vendor-plugins-all/manifest.json"
    cmds:
      - bun run dev:server

  dev:desktop:
    desc: Start the Stravia desktop application in Tauri development mode.
    deps: [install:web, build:vendors:all]
    env:
      STRAVIA_DEV_VENDOR_MANIFEST: "{{.ROOT_DIR}}/target/vendor-plugins-all/manifest.json"
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - bunx --bun @tauri-apps/cli@{{.TAURI_CLI_VERSION}} dev

  build:web:
    desc: Build the Stravia WebUI distribution assets.
    # 并行测试准备分支必须等待同一次构建，避免同时写入生成目录。
    run: once
    deps: [install:web]
    sources: &web_sources
      - Taskfile.yml
      - package.json
      - bun.lock
      - frontend/stravia-webui/package.json

      - frontend/stravia-webui/vite.config.ts
      - frontend/stravia-webui/tsconfig*.json
      - .env*
      - frontend/stravia-webui/.env*
      - frontend/stravia-webui/src/**/*
      - exclude: frontend/stravia-webui/src/lib/paraglide/**/*
      - frontend/stravia-webui/static/**/*
      - frontend/stravia-webui/messages/*.json
      - frontend/stravia-webui/project.inlang/**/*
      - frontend/stravia-webui/scripts/compile-i18n.ts
    generates:
      - frontend/stravia-webui/dist/index.html
    cmds:
      - bun run build:web

  build:web:desktop-e2e:
    desc: Build isolated desktop smoke-test WebUI assets.
    deps: [install:web]
    sources: *web_sources
    generates:
      - frontend/stravia-webui/dist-desktop-e2e/index.html
    cmds:
      - bun run build:web:desktop-e2e

  build:server:
    desc: Build the standalone Stravia server for production.
    deps: [build:web, build:vendors]
    cmds:
      - cargo build --locked -p stravia-server --release {{if .TARGET}}--target {{.TARGET}}{{end}}

  build:devtools:
    desc: Build Stravia development tools for production.
    deps: [build:vendors]
    cmds:
      - cargo build -p stravia-devtools --release

  build:server:debug:
    desc: Build the standalone Stravia server in debug mode without embedded WebUI assets.
    deps: [build:vendors]
    cmds:
      - cargo build -p stravia-server

  build:devtools:debug:
    desc: Build Stravia development tools in debug mode.
    deps: [build:vendors]
    cmds:
      - cargo build -p stravia-devtools

  build:test:workspace:
    desc: Incrementally prepare the complete supported Rust test executables.
    deps: [build:web, build:vendor-fixtures]
    sources: &rust_test_sources
      - Taskfile.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/*+*.patch
      - .cargo/config.toml
      - backend/**/*.rs
      - backend/**/*.toml
      - backend/**/*.json
      - backend/**/*.wit
      - backend/**/migrations/**/*.sql
      - backend/apps/stravia-desktop/icons/**/*
      - frontend/stravia-webui/dist/**/*
      - frontend/stravia-webui/dist-desktop-e2e/**/*
      - target/vendor-plugins/*.wasm
      - target/vendor-plugins/manifest.json
      - target/vendor-plugins-all/*.wasm
      - target/vendor-plugins-all/manifest.json
      - target/vendor-test-fixtures/*.wasm
      - tests/common/build-test-artifacts.ts
    generates: [target/test-artifacts/workspace/manifest.json]
    status: [bun tests/common/build-test-artifacts.ts --status workspace]
    cmds: [bun tests/common/build-test-artifacts.ts workspace]

  build:test:desktop-tests:
    desc: Prepare real desktop Rust unit tests without the native smoke feature.
    deps: [build:web, build:vendors]
    sources: *rust_test_sources
    generates: [target/test-artifacts/desktop-tests/manifest.json]
    status: [bun tests/common/build-test-artifacts.ts --status desktop-tests]
    cmds: [bun tests/common/build-test-artifacts.ts desktop-tests]

  build:test:services:
    desc: Preserve isolated release server, tools and storage-harness executables.
    deps: [build:web, build:vendors]
    sources: *rust_test_sources
    generates: [target/test-artifacts/services/manifest.json]
    status: [bun tests/common/build-test-artifacts.ts --status services]
    cmds: [bun tests/common/build-test-artifacts.ts services]

  build:test:release:
    desc: Preserve the production embedded-WebUI server for full testing.
    deps: [build:web, build:vendors]
    sources: *rust_test_sources
    generates: [target/test-artifacts/release/manifest.json]
    status: [bun tests/common/build-test-artifacts.ts --status release]
    cmds: [bun tests/common/build-test-artifacts.ts release]

  build:test:development:
    desc: Prepare an isolated default-feature graph for the real dev:server command.
    deps: [build:web, build:vendors:all]
    sources: *rust_test_sources
    generates: [target/test-artifacts/development/manifest.json]
    status: [bun tests/common/build-test-artifacts.ts --status development]
    cmds: [bun tests/common/build-test-artifacts.ts development]

  build:test:desktop-native:
    desc: Preserve the actual native smoke executable independently of unit builds.
    deps: [build:web:desktop-e2e, build:vendors]
    sources: *rust_test_sources
    generates: [target/test-artifacts/desktop-native/manifest.json]
    status: [bun tests/common/build-test-artifacts.ts --status desktop-native]
    cmds: [bun tests/common/build-test-artifacts.ts desktop-native]

  build:desktop:
    desc: Build Stravia desktop bundles for production.
    deps: [install:web, build:vendors]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - bunx --bun @tauri-apps/cli@{{.TAURI_CLI_VERSION}} build {{if .BUNDLES}}--bundles {{.BUNDLES}}{{end}} {{if .RUST_TARGET}}--target {{.RUST_TARGET}}{{end}} -- --locked

  build:desktop:installer:
    desc: Build the Windows NSIS desktop installer for production.
    cmds:
      - task: build:desktop
        vars:
          BUNDLES: nsis

  build:desktop:e2e:
    desc: Build the Windows desktop WebDriver smoke-test binary.
    deps: [install:web, build:vendors]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - bunx --bun @tauri-apps/cli@{{.TAURI_CLI_VERSION}} build --ci --debug --no-bundle --config tauri.e2e.conf.json

  test:e2e:desktop:
    desc: Run the Windows Tauri desktop smoke test.
    deps: [build:test:desktop-native, build:vendor-fixtures]
    env:
      STRAVIA_DESKTOP_E2E_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/desktop-native/stravia-desktop{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - bun tests/common/run-in-tempdir.ts bun run test:e2e:desktop

  check:web:
    internal: true
    desc: Run WebUI static checks through Bun.
    deps: [install:web]
    cmds:
      - bun run check:web
      - bun run lint:web
      - bun run format:check:web

  check:
    desc: Run fast static checks without building embedded WebUI assets.
    deps: [check:web, build:vendors]
    cmds:
      - cargo fmt --all -- --check
      - cargo run --locked -p stravia-devtools --bin stravia-tools -- wit-compat
      - cargo clippy --locked --workspace --exclude stravia-vendor-capability-contract-fixture --exclude stravia-vendor-lifecycle-contract-fixture --exclude stravia-vendor-management-contract-fixture --exclude stravia-vendor-manual-contract-fixture --exclude stravia-vendor-net-1-0-compat-fixture --exclude stravia-vendor-state-contract-fixture --all-targets -- -D warnings

  test:
    desc: Run WebUI and supported Rust unit tests without building embedded WebUI assets.
    deps: [install:web, build:vendor-fixtures]
    cmds:
      - bun tests/common/run-in-tempdir.ts bun run --filter stravia-webui test:unit
      - bun tests/common/run-in-tempdir.ts cargo test --locked --workspace --exclude stravia-desktop --exclude stravia-vendor-capability-contract-fixture --exclude stravia-vendor-lifecycle-contract-fixture --exclude stravia-vendor-management-contract-fixture --exclude stravia-vendor-manual-contract-fixture --exclude stravia-vendor-net-1-0-compat-fixture --exclude stravia-vendor-state-contract-fixture

  test:all:
    desc: Run every local test surface, including incremental builds and cleanup, with a five-minute budget.
    deps: [prepare:crates]
    cmds:
      - bun tests/common/run-all.ts

  test:e2e:proxy:
    desc: Run the proxy protocol matrix E2E tests.
    deps: [build:test:services]
    env:
      STRAVIA_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-server{{if eq OS "windows"}}.exe{{end}}'
      STRAVIA_TOOLS_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-tools{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - bun tests/common/run-in-tempdir.ts uv run --locked --default-index https://pypi.org/simple --group test python -m pytest tests/e2e/proxy -q -m proxy

  test:browser:
    desc: Run the real headless Chrome Web Access regression tests.
    deps: [prepare:crates]
    cmds:
      - bun tests/common/run-in-tempdir.ts cargo test --locked -p stravia-web-access browser::tests -- --ignored

  test:e2e:admin:
    desc: Run the Admin service E2E tests.
    # The development-origin E2E starts `cargo run`; prebuild that profile so a
    # cold CI runner tests the server instead of timing out during compilation.
    deps: [build:test:services, build:test:development, build:vendor-fixtures]
    env:
      STRAVIA_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-server{{if eq OS "windows"}}.exe{{end}}'
      STRAVIA_STORAGE_HARNESS_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-storage-test-harness{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - CARGO_TARGET_DIR="{{.ROOT_DIR}}/target/test-development" bun tests/common/run-in-tempdir.ts uv run --locked --default-index https://pypi.org/simple --group test python -m pytest tests/e2e/admin -q -m admin

  test:e2e:storage:sqlite:
    desc: Run the SQLite storage E2E tests.
    deps: [build:test:services, build:vendor-fixtures]
    env:
      STRAVIA_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-server{{if eq OS "windows"}}.exe{{end}}'
      STRAVIA_TOOLS_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-tools{{if eq OS "windows"}}.exe{{end}}'
      STRAVIA_STORAGE_HARNESS_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-storage-test-harness{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - bun tests/common/run-in-tempdir.ts uv run --locked --default-index https://pypi.org/simple --group test python -m pytest tests/e2e/storage -q --durations=0 -m storage -k sqlite

  test:e2e:storage:postgres:
    desc: Run the PostgreSQL storage E2E tests.
    requires:
      vars: [DB_URL, STRAVIA_TEST_REDIS_URL]
    deps: [build:test:services, build:vendor-fixtures]
    env:
      STRAVIA_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-server{{if eq OS "windows"}}.exe{{end}}'
      STRAVIA_TOOLS_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-tools{{if eq OS "windows"}}.exe{{end}}'
      STRAVIA_STORAGE_HARNESS_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-storage-test-harness{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - bun tests/common/run-in-tempdir.ts uv run --locked --default-index https://pypi.org/simple --group test python -m pytest tests/e2e/storage -q --durations=0 -m storage -k postgres

  test:e2e:web:
    desc: Run Chromium WebUI E2E tests using the cached embedded server and test-host support.
    deps: [build:test:release, build:test:services]
    env:
      PLAYWRIGHT_USE_PREBUILT: '1'
      STRAVIA_BINARY: '{{.ROOT_DIR}}/target/test-artifacts/services/stravia-server{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - bun tests/common/run-in-tempdir.ts bun run test:e2e:web

  test:e2e:
    desc: Run proxy, Admin service, SQLite, and PostgreSQL E2E tests.
    requires:
      vars: [DB_URL, STRAVIA_TEST_REDIS_URL]
    cmds:
      - task: test:e2e:proxy
      - task: test:e2e:admin
      - task: test:e2e:storage:sqlite
      - task: test:e2e:storage:postgres
